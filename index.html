button,input,select,textarea{font:inherit}button{cursor:pointer}.serif{font-family:Georgia,"Times New Roman",serif}.app-header{background:var(--black);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}.wrap{max-width:1120px;margin:auto}.brand{display:flex;align-items:center;gap:14px}.brand img{width:62px;height:62px;border-radius:12px;object-fit:cover}.brand h1{font:600 30px Georgia,serif;letter-spacing:.08em;margin:0}.eyebrow{font:italic 12px Georgia,serif;letter-spacing:.28em;color:var(--gold2);text-transform:uppercase;margin-bottom:3px}.header-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.big-btn{min-height:46px;padding:10px 15px;border-radius:7px;border:1px solid var(--gold);font-weight:650}.primary{background:var(--gold);color:var(--black)}.secondary{background:transparent;color:var(--gold2)}.subnav{background:#fff;border-bottom:1px solid var(--gold2);position:sticky;top:0;z-index:20;overflow-x:auto}.tabs{display:flex;gap:7px;padding:10px 12px;min-width:max-content}.tab{min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#555;font-weight:550}.tab.active{background:var(--black);border-color:var(--black);color:var(--gold2)}.content{padding:16px 12px 50px}.card{background:#fff;border:1px solid var(--gold2);border-radius:10px;padding:16px;margin-bottom:14px}.section-title{font:600 21px Georgia,serif;margin:0 0 13px}.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#999;margin-bottom:5px}.field{margin-bottom:10px}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:11px 10px;background:#fff;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--gold)}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.small-btn{min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#555;font-weight:600}.small-btn.gold{border-color:var(--gold);color:var(--gold)}.small-btn.dark{background:var(--black);border-color:var(--black);color:var(--gold2)}.danger{color:#a65353}.muted{color:#888;font-size:13px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#999;text-align:left;border-bottom:1px solid var(--gold2);padding:9px 7px;white-space:nowrap}.table td{border-bottom:1px solid #eee9dc;padding:9px 7px;vertical-align:top}.pill{display:inline-flex;align-items:center;padding:5px 8px;border:1px solid var(--gold2);border-radius:999px;font-size:11px}.empty{text-align:center;padding:30px;color:#999}.notice{background:#fbf6e9;border:1px solid var(--gold2);padding:10px;border-radius:7px;font-size:12px;color:#6b6b6b}.animal-list{display:flex;flex-direction:column;gap:5px}.animal{padding:11px;border-radius:7px;border:1px solid transparent;text-align:left;background:#fff}.animal.active{background:var(--cream);border-color:var(--gold2)}.chart-box{height:330px;width:100%;overflow:hidden}.chart-box svg{width:100%;height:100%;display:block}.history{background:var(--cream);border-radius:7px;padding:11px;margin-bottom:8px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px}.modal h3{margin:0 0 14px;font:600 23px Georgia,serif}.toast{position:fixed;right:12px;bottom:18px;background:var(--black);color:#fff;padding:11px 14px;border-radius:8px;z-index:120;font-size:13px}.hide{display:none!important}@media(min-width:700px){.app-header{padding:24px}.content{padding:22px 24px 70px}.brand img{width:72px;height:72px}.brand h1{font-size:38px}.header-actions{margin-top:0}.header-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.modal-back{align-items:center}.modal{border-radius:12px}}@media(max-width:699px){.g2,.g3,.g4{grid-template-columns:1fr}.g2.mobile2{grid-template-columns:repeat(2,minmax(0,1fr))}.desktop-only{display:none}.chart-box{height:300px}.table th,.table td{padding:8px 6px}.brand h1{font-size:27px}}

<script>
const KEY='gehret-sheep-co-v2';
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10),daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000),addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+Number(n||0));return x.toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const blankSheep=()=>({id:uid(),name:'',sex:'Wether',lEar:'',rEar:'',birthdate:'',breed:'',sire:'',dam:'',breeder:'',price:'',showman:'',county:'',notes:'',active:true,targetWeight:'',targetDate:''});
const blankEx=()=>({name:'',club4h:'',age:'',county:'',numSheep:'',targetShow:'',targetShowDate:'',osf:false}),blankShow=()=>({id:uid(),name:'',city:'',state:'',date:'',judge:'',notes:'',sheepIds:[],exhibitorIds:[]}),blankResult=()=>({id:uid(),showName:'',exhibitor:'',sheepId:'',showedAs:'',placing:''}),blankHerd=()=>({id:uid(),name:'',sex:'Ewe',lEar:'',rEar:'',birthdate:'',breed:'',sire:'',dam:'',breeder:'',notes:'',active:true}),blankBreed=()=>({id:uid(),ewe:'',eweTag:'',breedingDate:'',via:'A.I.',buck:'',ultrasound:'',actualLambing:'',carriedToTerm:'',bornAlive:'',males:'',females:'',notes:''});
const defaultState={section:'show',tab:'roster',years:[String(new Date().getFullYear())],year:String(new Date().getFullYear()),exhibitors:[],sheep:[],weights:{},feeds:{},feedCatalog:[],shows:[],results:[],health:{},herd:[],breeding:[]};
let S=load();function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaultState}}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function exForYear(){return S.exhibitors.find(e=>e.year===S.year)?.data||blankEx()}function sheepForYear(){return S.sheep.filter(s=>s.year===S.year)}function setYearEx(data){const i=S.exhibitors.findIndex(e=>e.year===S.year);if(i>=0)S.exhibitors[i].data=data;else S.exhibitors.push({year:S.year,data});save()}function setYearSheep(arr){S.sheep=S.sheep.filter(s=>s.year!==S.year).concat(arr.map(s=>({...s,year:S.year})));save()}function yrWeights(){return S.weights[S.year]||{}}function setYrWeights(x){S.weights[S.year]=x;save()}function yrFeeds(){return S.feeds[S.year]||{}}function setYrFeeds(x){S.feeds[S.year]=x;save()}function yrShows(){return S.shows.filter(x=>x.year===S.year)}function setYrShows(arr){S.shows=S.shows.filter(x=>x.year!==S.year).concat(arr.map(x=>({...x,year:S.year})));save()}function yrResults(){return S.results.filter(x=>x.year===S.year)}function setYrResults(arr){S.results=S.results.filter(x=>x.year!==S.year).concat(arr.map(x=>({...x,year:S.year})));save()}
const CATALOG=[['Purina','Honor Show Showlamb Creep Pellet DX','Feed'],['Purina','Honor Show Showlamb Creep 20 DX30','Feed'],['Purina','Honor Show Showlamb GR 15 DX TXT','Feed'],['Purina','Honor Show Showlamb Grower 18% DX','Feed'],['Purina','Honor Showlamb Stretch 17 TXT DX','Feed'],['Purina','High Octane Champion Drive Topdress','Supplement'],['Purina','High Octane Fitter 35 Topdress','Supplement'],['Purina','High Octane Power Fuel Extreme Topdress','Supplement'],['Purina','High Octane Heavy Weight Topdress','Supplement'],['Umbarger','Lamb 19% (Top Choice)','Feed'],['Umbarger','Lamb Creep 19%','Feed'],['Umbarger','Lamb Creep 18%','Feed'],['Umbarger','Lamb 17% with Barley','Feed'],['Umbarger','Lamb 16% Hi-Energy','Feed'],['Umbarger','Bulletproof','Supplement'],['Umbarger','Loaded','Supplement'],['Umbarger','Star Glo','Supplement'],['Umbarger','Change Up','Supplement'],['Umbarger','Apex','Supplement'],['Show-Rite','NewCo Lamb Feed D22.7','Feed'],['Show-Rite','NewCo Lamb Creep D22.7','Feed'],['Show-Rite','Fundamental Sheep 14% D22.7','Feed'],['Show-Rite','Lamb Nutribase 800 A Plus','Feed'],['Show-Rite','Colossal','Supplement'],['Show-Rite','Yolked','Supplement'],['Show-Rite','Rite Flex','Supplement'],['Show-Rite','Star Shine','Supplement'],['Show-Rite','Stretch','Supplement'],['Show-Rite','Exhale','Supplement'],['Show-Rite','Seco-Sorb','Supplement'],['Show-Rite','Sculpt','Supplement'],['Show-Rite','Swell','Supplement'],['Show-Rite','Fat-N-Fluffy','Supplement'],['Show-Rite','Rite Tyme','Supplement'],['Essential','Essential 417','Feed'],['Essential','Money Maker (Creep)','Feed'],['Essential','Essential 330','Feed'],['Essential','14.5% Ewe Feed','Feed'],['Essential','Repro Plus','Supplement'],['Essential','Sheep & Goat DFM','Supplement'],['Essential','Concept Mineral','Supplement'],['Essential','Torch','Supplement'],['Essential','Chub','Supplement'],['Essential','Foundation','Supplement'],['Essential','Crease','Supplement'],['Essential','Flare','Supplement'],['Essential','Voltage','Supplement'],['Essential','Touch Tone','Supplement'],['Essential','Uni4m','Supplement'],['Essential','Fluff','Supplement'],['Essential','Sasquatch','Supplement'],['Essential','Glisten','Supplement'],['Essential','Equex','Supplement'],['Essential','Composure','Supplement'],['Essential','Belly Down','Supplement'],['High Noon','Show Lamb #104','Feed'],['High Noon','Show Lamb Extreme (HN112)','Feed'],['High Noon','Pro Show Lamb (HN105)','Feed'],['High Noon','Max Start 90 (HN101)','Feed'],['High Noon','Max Start Plus (HN102)','Feed'],['High Noon','Sure Shot (THN123)','Feed'],['High Noon','Monkey Munch (#113)','Feed'],['High Noon','Punch','Feed'],['High Noon','Charmasson','Feed'],['High Noon','36% Ewe & Lamb Supplement (HN110)','Supplement'],['High Noon','HN 506 Sheep Mineral','Supplement'],['High Noon','Extra Fill (HN124)','Supplement'],['High Noon','Original Glo','Supplement'],['High Noon','High Glo','Supplement'],['High Noon','Clean Expression','Supplement'],['High Noon','Shine Em Up','Supplement'],['High Noon','Fresh Look Advanced','Supplement'],['Sullivan Supply','ShowBloom','Supplement'],['Sullivan Supply','Swell','Supplement'],['Sullivan Supply','Bloom-n-Secret','Supplement'],['Sullivan Supply','Restore Pro','Supplement'],['Sullivan Supply','Appetite Express','Supplement'],['Sullivan Supply','Peace Pellets','Supplement'],['Sullivan Supply','Show Shake','Supplement'],['Sunglo','Show Lamb','Feed'],['Sunglo','Game On','Supplement'],['Sunglo','Smore Fill','Supplement'],['Sunglo','Full Tank','Supplement'],['Sunglo','Sumo','Supplement'],['Sunglo','4-Sure','Supplement'],['Sunglo','Final Control','Supplement'],['Sunglo','In Motion','Supplement'],['Sunglo','Liquafat','Supplement'],['Sunglo','Epic','Supplement'],['Sunglo','2 The Fullest','Supplement'],['Kent','Show Lamb Breeze 45DQ','Feed'],['Kent','Show Lamb Gale Force 18DQ','Feed'],['Kent','Show Lamb Gale Force HE 18DQ','Feed'],['Kent','ShowBoss Final Drive','Supplement'],['Kent','ShowBoss Fit N Finish','Supplement'],['Kent','ShowBoss FATfetti','Supplement'],['Kent','ShowBoss Biomend','Supplement'],['Kent','ShowBoss Lowdown','Supplement'],['Kent','ShowBoss Contour','Supplement'],['Kent','ShowBoss Winning Fill','Supplement'],['Rule','Thicc','Supplement'],['Rule','Shredded R','Supplement'],['Rule','The Formula','Supplement'],['Rule','Fresh N Full','Supplement'],['Rule','Swoop','Supplement'],['Rule','Gorge','Supplement'],['Rule','Wintex Punch','Supplement'],['Rule','TotalCare Sheep','Supplement'],['Rule','Struttin','Supplement'],['Rule','Flex Appeal','Supplement'],['Natural Fill','Natural Fill','Supplement']].map(([company,name,type])=>({id:company+'|'+name,company,name,type}));
function catalog(){return CATALOG.concat(S.feedCatalog||[])}
function render(){document.getElementById('app').innerHTML=`<header class="app-header"><div class="wrap header-top"><div class="brand"><img src="apple-touch-icon.png"><div><div class="eyebrow">Sheep Records</div><h1>GEHRET SHEEP CO</h1></div></div><div class="header-actions"><button class="big-btn ${S.section==='show'?'primary':'secondary'}" onclick="switchSection('show')">Show Barn</button><button class="big-btn ${S.section==='herd'?'primary':'secondary'}" onclick="switchSection('herd')">Herd View</button>${S.section==='show'?`<button class="big-btn secondary" onclick="openYear()">＋ Add / View Year</button><button class="big-btn secondary" onclick="printReport()">▣ PDF Report</button><button class="big-btn secondary" onclick="exportExcel()">▤ Excel Export</button>`:''}</div></div>${S.section==='show'?`<div class="wrap row" style="margin-top:14px"><strong style="color:var(--gold2)">Season:</strong>${S.years.map(y=>`<button class="big-btn ${y===S.year?'primary':'secondary'}" onclick="changeYear('${esc(y)}')">${esc(y)}</button>`).join('')}</div>`:''}</header><nav class="subnav"><div class="wrap tabs">${(S.section==='show'?['roster','weights','feeds','health','calendar','results']:['roster','breeding']).map(t=>`<button class="tab ${S.tab===t?'active':''}" onclick="setTab('${t}')">${({roster:'Roster',weights:'Weights',feeds:'Feeds',health:'Health Records',calendar:'Show Calendar',results:'Show Results',breeding:'Breeding Records'})[t]}</button>`).join('')}</div></nav><main class="wrap content">${S.section==='show'?renderShow():renderHerd()}</main>`}
function switchSection(x){S.section=x;S.tab='roster';save();render()}function setTab(x){S.tab=x;render()}function changeYear(y){S.year=y;S.tab='roster';save();render()}function openYear(){modal(`<h3>Add / View Show Barn Year</h3><div class="grid g2"><div class="field"><div class="label">Year</div><input id="mYear" class="input" value="${new Date().getFullYear()+1}"></div><div class="field"><div class="label">Description</div><input id="mDesc" class="input" placeholder="Summer, Fall, Spring"></div></div><div class="notice">Previous seasons remain available above. Herd View is continuous and does not use years.</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="addYear()">Add Year</button></div>`)}function addYear(){const y=document.getElementById('mYear').value.trim(),d=document.getElementById('mDesc').value.trim();if(!/^\d{4}$/.test(y))return toast('Enter a 4-digit year');const label=d?`${y} — ${d}`:y;if(!S.years.includes(label))S.years.push(label);S.year=label;save();closeModal();render()}function modal(html){const d=document.createElement('div');d.id='modal';d.className='modal-back';d.innerHTML=`<div class="modal">${html}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d)}function closeModal(){document.getElementById('modal')?.remove()}
function field(label,val,key,type='text'){return `<div class="field"><div class="label">${label}</div><input class="input" type="${type}" data-k="${key}" value="${esc(val)}"></div>`}
function renderShow(){return ({roster:renderShowRoster,weights:renderWeights,feeds:renderFeeds,health:renderHealth,calendar:renderCalendar,results:renderResults}[S.tab]||renderShowRoster)()}
function renderShowRoster(){const ex=exForYear(),sh=sheepForYear();return `<div class="card"><div class="row between"><div><h2 class="section-title">Exhibitor</h2><div class="muted">Exhibitors can be saved by themselves. Sheep can be assigned later.</div></div><button class="small-btn dark" onclick="saveExhibitor()">Save Exhibitor</button></div><div class="grid g2 mobile2">${field('Exhibitor Name',ex.name,'name')}${field('4-H Club',ex.club4h,'club4h')}${field('Age',ex.age,'age')}${field('County',ex.county,'county')}${field('# of Sheep',ex.numSheep,'numSheep')}${field('Target Show',ex.targetShow,'targetShow')}${field('Target Show Date',ex.targetShowDate,'targetShowDate','date')}<div class="field"><div class="label">OSF?</div><button id="osfBtn" class="input" onclick="toggleExOSF()" style="text-align:left">${ex.osf?'Yes':'No'}</button></div></div></div><div class="card"><div class="row between"><h2 class="section-title">Sheep Roster (${sh.length})</h2><button class="small-btn dark" onclick="addSheep()">＋ Add Sheep</button></div>${sh.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Sex</th><th>Showman</th><th>Active</th><th></th></tr></thead><tbody>${sh.map(s=>`<tr><td><strong>${esc(s.name||'Unnamed')}</strong></td><td>${esc(s.sex)}</td><td>${esc(s.showman||'—')}</td><td><button class="pill" onclick="toggleSheep('${s.id}')">${s.active?'Active':'Inactive'}</button></td><td><button class="small-btn" onclick="editSheep('${s.id}')">Edit</button> <button class="small-btn danger" onclick="deleteSheep('${s.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No sheep added yet. Add an exhibitor first or add sheep now.</div>'}</div>`}
function saveExhibitor(){const ex=exForYear();document.querySelectorAll('[data-k]').forEach(i=>ex[i.dataset.k]=i.value);setYearEx(ex);toast('Exhibitor saved');render()}function toggleExOSF(){const ex=exForYear();ex.osf=!ex.osf;setYearEx(ex);render()}function addSheep(){const a=sheepForYear();a.push(blankSheep());setYearSheep(a);editSheep(a[a.length-1].id)}function toggleSheep(id){const a=sheepForYear(),s=a.find(x=>x.id===id);s.active=!s.active;setYearSheep(a);render()}function deleteSheep(id){if(!confirm('Delete this sheep and its records?'))return;setYearSheep(sheepForYear().filter(s=>s.id!==id));const w=yrWeights();delete w[id];setYrWeights(w);const f=yrFeeds();delete f[id];setYrFeeds(f);render()}
function editSheep(id){const s=sheepForYear().find(x=>x.id===id);modal(`<h3>Edit Sheep</h3><div class="grid g2 mobile2">${field('Name',s.name,'name')}${field('Sex',s.sex,'sex')}${field('L Ear',s.lEar,'lEar')}${field('R Ear',s.rEar,'rEar')}${field('Birthdate',s.birthdate,'birthdate','date')}${field('Breed',s.breed,'breed')}${field('Sire',s.sire,'sire')}${field('Dam',s.dam,'dam')}${field('Breeder',s.breeder,'breeder')}${field('Price',s.price,'price')}${field('Showman',s.showman,'showman')}${field('County',s.county,'county')}${field('Target Weight',s.targetWeight,'targetWeight')}${field('Target Date',s.targetDate,'targetDate','date')}<div class="field"><div class="label">Active</div><button id="editActive" class="input" onclick="this.dataset.v=this.dataset.v==='1'?'0':'1';this.textContent=this.dataset.v==='1'?'Yes':'No'" data-v="${s.active?'1':'0'}">${s.active?'Yes':'No'}</button></div></div>${field('Notes',s.notes,'notes')}<div class="row" style="justify-content:flex-end"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="saveSheepEdit('${id}')">Save Sheep</button></div>`)}function saveSheepEdit(id){const a=sheepForYear(),s=a.find(x=>x.id===id);document.querySelectorAll('[data-k]').forEach(i=>s[i.dataset.k]=i.value);s.active=document.getElementById('editActive').dataset.v==='1';setYearSheep(a);closeModal();render()}
function weightStats(id){const list=(yrWeights()[id]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));if(!list.length)return{};const last=list[list.length-1],first=list[0],d=daysBetween(first.date,last.date);return{list,last,first,adg:d?(last.weight-first.weight)/d:null}}
function renderWeights(){const sh=sheepForYear(),w=yrWeights();if(!sh.length)return `<div class="card empty">Add sheep to the roster first.</div>`;return `<div class="card"><div class="row between"><div><h2 class="section-title">Weight Trajectory</h2><div class="muted">The graph is SVG-based so it stays visible on iPhone without a desktop chart library.</div></div><button class="small-btn dark" onclick="addWeight()">＋ Add Weigh-In</button></div><div class="chart-box">${makeChart(sh,w)}</div></div><div class="card"><h2 class="section-title">Weight Records</h2><div class="table-wrap"><table class="table"><thead><tr><th>Sheep</th><th>Latest</th><th>ADG</th><th>Entries</th><th></th></tr></thead><tbody>${sh.map(s=>{const st=weightStats(s.id);return `<tr><td><strong>${esc(s.name||'Unnamed')}</strong></td><td>${st.last?st.last.weight+' lbs':'—'}</td><td>${st.adg==null?'—':st.adg.toFixed(2)+' lb/day'}</td><td>${st.list?.length||0}</td><td><button class="small-btn" onclick="showWeightHistory('${s.id}')">View / Add</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function makeChart(sh,w){const all=[];sh.forEach(s=>(w[s.id]||[]).forEach(x=>all.push(x)));if(!all.length)return '<div class="empty">No weigh-ins yet. Add the first one and the line graph will appear.</div>';const dates=[...new Set(all.map(x=>x.date))].sort(),vals=all.map(x=>+x.weight);let min=Math.max(0,Math.floor(Math.min(...vals)-10)),max=Math.ceil(Math.max(...vals)+10);if(max-min<30)max=min+30;const W=900,H=300,L=46,R=14,T=18,B=42,iw=W-L-R,ih=H-T-B,colors=['#b8963f','#4a6c6f','#8c4a4a','#5b6b8c','#7a8c4a','#8c5b7a'];let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight line graph"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;for(let i=0;i<5;i++){const y=T+ih*i/4,val=max-(max-min)*i/4;svg+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#eee9dc"/><text x="${L-7}" y="${y+4}" text-anchor="end" font-size="11" fill="#888">${Math.round(val)}</text>`}dates.forEach((d,i)=>{const x=L+iw*(dates.length===1?.5:i/(dates.length-1));svg+=`<text x="${x}" y="${H-12}" text-anchor="middle" font-size="10" fill="#888">${esc(d.slice(5))}</text>`});sh.forEach((s,si)=>{const list=w[s.id]||[],pts=list.map(e=>{const x=L+iw*(dates.length===1?.5:dates.indexOf(e.date)/(dates.length-1)),y=T+ih*(max-e.weight)/(max-min);return[x,y,e.weight,e.date]});if(!pts.length)return;svg+=`<polyline fill="none" stroke="${colors[si%colors.length]}" stroke-width="3" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;pts.forEach(p=>svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${colors[si%colors.length]}"><title>${esc(s.name||'Unnamed')}: ${p[2]} lbs on ${p[3]}</title></circle>`);svg+=`<text x="${L+8+si*110}" y="16" font-size="11" fill="${colors[si%colors.length]}">${esc(s.name||'Unnamed')}</text>`});return svg+'</svg>'}
function addWeight(){const sh=sheepForYear();modal(`<h3>Add Weigh-In</h3><div class="grid g2 mobile2"><div class="field"><div class="label">Sheep</div><select id="wSheep" class="select">${sh.map(s=>`<option value="${s.id}">${esc(s.name||'Unnamed')}</option>`).join('')}</select></div><div class="field"><div class="label">Date</div><input id="wDate" class="input" type="date" value="${today()}"></div><div class="field"><div class="label">Weight (lbs)</div><input id="wVal" class="input" type="number" step="0.1"></div></div><div class="row" style="justify-content:flex-end"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="saveWeight()">Save Weigh-In</button></div>`)}function saveWeight(){const id=document.getElementById('wSheep').value,d=document.getElementById('wDate').value,v=parseFloat(document.getElementById('wVal').value);if(!id||!d||isNaN(v))return toast('Enter sheep, date and weight');const w=yrWeights();w[id]=[...(w[id]||[]),{id:uid(),date:d,weight:v}].sort((a,b)=>a.date.localeCompare(b.date));setYrWeights(w);closeModal();render()}function showWeightHistory(id){const s=sheepForYear().find(x=>x.id===id),list=(yrWeights()[id]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));modal(`<h3>${esc(s.name||'Unnamed')} — Weight History</h3>${list.length?list.map(x=>`<div class="history row between"><span>${x.date}</span><strong>${x.weight} lbs</strong><button class="small-btn danger" onclick="deleteWeight('${id}','${x.id}')">Delete</button></div>`).join(''):'<div class="empty">No weigh-ins.</div>'}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="small-btn dark" onclick="closeModal();addWeight()">＋ Add Weigh-In</button></div>`)}function deleteWeight(id,wid){const w=yrWeights();w[id]=(w[id]||[]).filter(x=>x.id!==wid);setYrWeights(w);closeModal();render()}
let selectedFeed=null;function currentFeed(sid){return(yrFeeds()[sid]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0]}function feedAmount(f){return[f.feed?.product?`${f.feed.product}: ${f.feed.lbs||0} lb ${f.feed.oz||0} oz`:null,f.supp?.product?`${f.supp.product}: ${f.supp.oz||0} oz`:null,f.drench?.cc?`${f.drench.cc} cc drench`:null,f.hay?.handfuls?`${f.hay.handfuls} handfuls hay`:null].filter(Boolean).join(' · ')||'Not set'}
function renderFeeds(){const sh=sheepForYear();if(!sh.length)return `<div class="card empty">Add sheep to the roster first.</div>`;return `<div class="card"><h2 class="section-title">Current Feeding Program</h2><div class="muted" style="margin-bottom:12px">Only each sheep's current program is shown here. Select an animal to see dated changes and history.</div>${sh.map(s=>{const f=currentFeed(s.id);return `<button class="animal ${selectedFeed===s.id?'active':''}" onclick="selectedFeed='${s.id}';render()"><div class="row between"><strong>${esc(s.name||'Unnamed')}</strong><span class="muted">${f?.date||'No update'}</span></div><div class="muted">${esc(f?feedAmount(f):'Not set')}</div></button>`}).join('')}</div>${selectedFeed?renderFeedDetail(selectedFeed):''}`}
function renderFeedDetail(id){const s=sheepForYear().find(x=>x.id===id),hist=(yrFeeds()[id]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><div class="row between"><div><h2 class="section-title">${esc(s.name||'Unnamed')}</h2><div class="muted">Feed history</div></div><button class="small-btn dark" onclick="feedModal('${id}')">＋ Log Feed Update</button></div>${hist.length?hist.map(h=>`<div class="history"><div class="row between"><strong>${h.date}</strong><button class="small-btn danger" onclick="deleteFeed('${id}','${h.id}')">Delete</button></div><div style="margin-top:6px">${esc(feedAmount(h))}</div>${h.extra?`<div class="muted" style="margin-top:4px">Additional: ${esc(h.extra)}</div>`:''}</div>`).join(''):'<div class="empty">No feed changes recorded.</div>'}</div>`}
function feedModal(id){modal(`<h3>Feed Update</h3><div class="field"><div class="label">Date Changed</div><input id="fDate" class="input" type="date" value="${today()}"></div><div class="grid g2 mobile2"><div class="field"><div class="label">Feed / Grain</div>${feedSelect('fProduct')}</div><div class="grid g2 mobile2"><div class="field"><div class="label">Feed lbs</div><input id="fLbs" class="input" type="number" step="0.1"></div><div class="field"><div class="label">Feed oz</div><input id="fOz" class="input" type="number" step="0.1"></div></div><div class="field"><div class="label">Supplements</div>${feedSelect('sProduct','Supplement')}</div><div class="field"><div class="label">Supplement oz</div><input id="sOz" class="input" type="number" step="0.1"></div><div class="field"><div class="label">Drench (cc)</div><input id="dCc" class="input" type="number" step="0.1"></div><div class="field"><div class="label">Hay (handfuls)</div><input id="hHand" class="input" type="number" step="0.1"></div></div><div class="field"><div class="label">Additional feed / supplement (optional)</div><input id="extra" class="input" placeholder="Any additional item or amount"></div><div class="row" style="justify-content:flex-end"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="saveFeed('${id}')">Save Feed Update</button></div>`)}
function feedSelect(id,type){const opts=catalog().filter(x=>!type||x.type===type);return `<select id="${id}" class="select"><option value="">Select from feed/supplement catalog…</option>${opts.map(x=>`<option value="${esc(x.company+' — '+x.name)}">${esc(x.company+' — '+x.name)}</option>`).join('')}<option value="__custom__">＋ Custom Feed / Supplement…</option></select>`}
function saveFeed(id){const f={id:uid(),date:document.getElementById('fDate').value,feed:{product:document.getElementById('fProduct').value,lbs:document.getElementById('fLbs').value,oz:document.getElementById('fOz').value},supp:{product:document.getElementById('sProduct').value,oz:document.getElementById('sOz').value},drench:{cc:document.getElementById('dCc').value},hay:{handfuls:document.getElementById('hHand').value},extra:document.getElementById('extra').value};if(f.feed.product==='__custom__'||f.supp.product==='__custom__'){closeModal();customFeedModal(id,f);return}const x=yrFeeds();x[id]=[...(x[id]||[]),f].sort((a,b)=>a.date.localeCompare(b.date));setYrFeeds(x);closeModal();render()}
function customFeedModal(id,pending){modal(`<h3>Custom Feed / Supplement</h3><div class="grid g2 mobile2">${field('Name','','cName')}${field('Category','Feed','cCat')}</div><div class="grid g3">${field('Crude Protein %','','cCp')}${field('Fat %','','cFat')}${field('Fiber %','','cFib')}</div>${field('Intended Use / Notes','','cUse')}<div class="row" style="justify-content:flex-end"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="saveCustom('${id}')">Save Custom Feed</button></div>`);window.pendingFeed={id,pending}}
function saveCustom(id){const name=document.querySelector('[data-k="cName"]').value.trim();if(!name)return toast('Enter a feed name');const cf={id:uid(),company:'Custom',name,type:document.querySelector('[data-k="cCat"]').value,cp:document.querySelector('[data-k="cCp"]').value,fat:document.querySelector('[data-k="cFat"]').value,fib:document.querySelector('[data-k="cFib"]').value,use:document.querySelector('[data-k="cUse"]').value};S.feedCatalog.push(cf);const p=window.pendingFeed.pending;if(p.feed.product==='__custom__')p.feed.product='Custom — '+name;if(p.supp.product==='__custom__')p.supp.product='Custom — '+name;const x=yrFeeds();x[id]=[...(x[id]||[]),p].sort((a,b)=>a.date.localeCompare(b.date));setYrFeeds(x);closeModal();render()}
function deleteFeed(id,fid){const x=yrFeeds();x[id]=(x[id]||[]).filter(f=>f.id!==fid);setYrFeeds(x);render()}
function renderHealth(){const sh=sheepForYear();return `<div class="card"><div class="row between"><div><h2 class="section-title">Health Records</h2><div class="muted">Track vaccinations, dewormers, treatments and withdrawal dates.</div></div><button class="small-btn dark" onclick="healthModal()">＋ Add Record</button></div>${sh.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Sheep</th><th>Date</th><th>Type</th><th>Product</th><th>Dose</th><th>Withdrawal</th><th></th></tr></thead><tbody>${sh.flatMap(s=>(S.health[S.year]?.[s.id]||[]).map(r=>`<tr><td>${esc(s.name||'Unnamed')}</td><td>${r.date}</td><td>${esc(r.type)}</td><td>${esc(r.product)}</td><td>${esc(r.dose||'')}</td><td>${r.withdrawal?esc(addDays(r.date,r.withdrawal)):'—'}</td><td><button class="small-btn danger" onclick="deleteHealth('${s.id}','${r.id}')">Delete</button></td></tr>`)).join('')||'<tr><td colspan="7" class="empty">No health records yet.</td></tr>'}</tbody></table></div>`:'<div class="empty">Add sheep first.</div>'}</div>`}
function healthModal(){const sh=sheepForYear();modal(`<h3>Add Health Record</h3><div class="grid g2 mobile2"><div class="field"><div class="label">Sheep</div><select id="hSheep" class="select">${sh.map(s=>`<option value="${s.id}">${esc(s.name||'Unnamed')}</option>`).join('')}</select></div>${field('Date',today(),'hDate','date')}${field('Type','Vaccination','hType')}${field('Product / Medication','','hProduct')}${field('Dose','','hDose')}${field('Withdrawal Days','','hWd','number')}${field('Notes','','hNotes')}</div><div class="row" style="justify-content:flex-end"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="saveHealth()">Save Record</button></div>`)}function saveHealth(){const id=document.getElementById('hSheep').value,r={id:uid(),date:document.querySelector('[data-k="hDate"]').value,type:document.querySelector('[data-k="hType"]').value,product:document.querySelector('[data-k="hProduct"]').value,dose:document.querySelector('[data-k="hDose"]').value,withdrawal:document.querySelector('[data-k="hWd"]').value,notes:document.querySelector('[data-k="hNotes"]').value};S.health[S.year]=S.health[S.year]||{};S.health[S.year][id]=[...(S.health[S.year][id]||[]),r];save();closeModal();render()}function deleteHealth(id,rid){S.health[S.year][id]=(S.health[S.year][id]||[]).filter(r=>r.id!==rid);save();render()}
function renderCalendar(){const shows=yrShows().sort((a,b)=>(a.date||'').localeCompare(b.date||'')),sh=sheepForYear(),ex=exForYear();return `<div class="card"><div class="row between"><div><h2 class="section-title">Show Calendar</h2><div class="muted">Status and entry-deadline fields are removed. Select the sheep and exhibitor going.</div></div><button class="small-btn dark" onclick="showModal()">＋ Add Show</button></div>${shows.length?shows.map(s=>`<div class="history"><div class="row between"><div><strong>${esc(s.name)}</strong><div class="muted">${esc([s.city,s.state].filter(Boolean).join(', '))} ${s.date?'· '+s.date:''} ${s.judge?'· Judge: '+esc(s.judge):''}</div></div><div><button class="small-btn" onclick="editShow('${s.id}')">Edit</button> <button class="small-btn danger" onclick="deleteShow('${s.id}')">Delete</button></div></div><div class="muted" style="margin-top:7px">Sheep: ${(s.sheepIds||[]).map(id=>esc(sh.find(x=>x.id===id)?.name||'')).filter(Boolean).join(', ')||'None selected'} · Exhibitor: ${esc((s.exhibitorIds||[]).join(', ')||ex.name||'None')}</div></div>`).join(''):'<div class="empty">No shows entered.</div>'}</div>`}
function showModal(existing){const s=existing||blankShow(),sh=sheepForYear(),ex=exForYear();modal(`<h3>${existing?'Edit':'Add'} Show</h3><div class="grid g2 mobile2">${field('Show Name',s.name,'sName')}${field('City',s.city,'sCity')}${field('State',s.state,'sState')}${field('Show Date',s.date,'sDate','date')}${field('Judge',s.judge,'sJudge')}</div>${field('Notes',s.notes,'sNotes')}<div class="field"><div class="label">Sheep Going</div><select id="sSheep" class="select" multiple size="${Math.min(5,Math.max(2,sh.length))}">${sh.map(x=>`<option value="${x.id}" ${(s.sheepIds||[]).includes(x.id)?'selected':''}>${esc(x.name||'Unnamed')}</option>`).join('')}</select></div><div class="field"><div class="label">Exhibitor Going</div><select id="sEx" class="select" multiple size="2"><option value="${esc(ex.name)}" ${(s.exhibitorIds||[]).includes(ex.name)?'selected':''}>${esc(ex.name||'Current Exhibitor')}</option>${S.exhibitors.filter(e=>e.year===S.year&&e.data.name&&e.data.name!==ex.name).map(e=>`<option value="${esc(e.data.name)}" ${(s.exhibitorIds||[]).includes(e.data.name)?'selected':''}>${esc(e.data.name)}</option>`).join('')}</select></div><div class="row" style="justify-content:flex-end"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="saveShow('${existing?.id||''}')">Save Show</button></div>`)}function selectedVals(id){return[...document.getElementById(id).selectedOptions].map(o=>o.value)}function saveShow(id){const a=yrShows(),s=id?a.find(x=>x.id===id):blankShow();Object.assign(s,{name:document.querySelector('[data-k="sName"]').value,city:document.querySelector('[data-k="sCity"]').value,state:document.querySelector('[data-k="sState"]').value,date:document.querySelector('[data-k="sDate"]').value,judge:document.querySelector('[data-k="sJudge"]').value,notes:document.querySelector('[data-k="sNotes"]').value,sheepIds:selectedVals('sSheep'),exhibitorIds:selectedVals('sEx')});if(!id)a.push(s);setYrShows(a);closeModal();render()}function editShow(id){showModal(yrShows().find(x=>x.id===id))}function deleteShow(id){setYrShows(yrShows().filter(x=>x.id!==id));render()}
function renderResults(){const r=yrResults(),sh=sheepForYear(),ex=exForYear();return `<div class="card"><div class="row between"><div><h2 class="section-title">Show Results</h2><div class="muted">Results are kept as a running list for the selected show-barn season.</div></div><button class="small-btn dark" onclick="resultModal()">＋ Add Result</button></div>${r.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Show</th><th>Exhibitor</th><th>Sheep</th><th>Showed As</th><th>Placing</th><th></th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.showName)}</td><td>${esc(x.exhibitor)}</td><td>${esc(sh.find(s=>s.id===x.sheepId)?.name||'')}</td><td>${esc(x.showedAs)}</td><td><strong>${esc(x.placing)}</strong></td><td><button class="small-btn" onclick="editResult('${x.id}')">Edit</button> <button class="small-btn danger" onclick="deleteResult('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No show results entered.</div>'}</div>`}
function resultModal(existing){const r=existing||blankResult(),sh=sheepForYear(),ex=exForYear();modal(`<h3>${existing?'Edit':'Add'} Show Result</h3>${field('Show Name',r.showName,'rShow')}<div class="grid g2 mobile2"><div class="field"><div class="label">Exhibitor</div><select id="rEx" class="select"><option value="${esc(ex.name)}">${esc(ex.name||'Current Exhibitor')}</option>${S.exhibitors.filter(e=>e.year===S.year&&e.data.name&&e.data.name!==ex.name).map(e=>`<option value="${esc(e.data.name)}">${esc(e.data.name)}</option>`).join('')}</select></div><div class="field"><div class="label">Sheep</div><select id="rSheep" class="select"><option value="">Select sheep</option>${sh.map(s=>`<option value="${s.id}" ${r.sheepId===s.id?'selected':''}>${esc(s.name||'Unnamed')}</option>`).join('')}</select></div>${field('Showed As',r.showedAs,'rAs')}${field('Placing',r.placing,'rPlace')}</div><div class="row" style="justify-content:flex-end"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="saveResult('${existing?.id||''}')">Save Result</button></div>`)}function saveResult(id){const a=yrResults(),r=id?a.find(x=>x.id===id):blankResult();Object.assign(r,{showName:document.querySelector('[data-k="rShow"]').value,exhibitor:document.getElementById('rEx').value,sheepId:document.getElementById('rSheep').value,showedAs:document.querySelector('[data-k="rAs"]').value,placing:document.querySelector('[data-k="rPlace"]').value});if(!id)a.push(r);setYrResults(a);closeModal();render()}function editResult(id){resultModal(yrResults().find(x=>x.id===id))}function deleteResult(id){setYrResults(yrResults().filter(x=>x.id!==id));render()}
function renderHerd(){const h=S.herd.slice().sort((a,b)=>{if(a.active!==b.active)return a.active?-1:1;const d=(a.birthdate||'9999').localeCompare(b.birthdate||'9999');return a.active?d:-d});return S.tab==='breeding'?renderBreeding():`<div class="card"><div class="row between"><div><h2 class="section-title">Herd Roster</h2><div class="muted">Active animals are oldest-to-youngest. Inactive animals are below them, youngest-to-oldest.</div></div><button class="small-btn dark" onclick="addHerd()">＋ Add Animal</button></div>${h.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Sex</th><th>Breed</th><th>Birthdate</th><th>Active</th><th></th></tr></thead><tbody>${h.map(s=>`<tr><td><strong>${esc(s.name||'Unnamed')}</strong></td><td>${s.sex}</td><td>${esc(s.breed||'')}</td><td>${s.birthdate||'—'}</td><td><button class="pill" onclick="toggleHerd('${s.id}')">${s.active?'Active':'Inactive'}</button></td><td><button class="small-btn" onclick="editHerd('${s.id}')">Edit</button> <button class="small-btn danger" onclick="deleteHerd('${s.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No herd animals yet.</div>'}</div>`}
function addHerd(){S.herd.push(blankHerd());save();editHerd(S.herd[S.herd.length-1].id)}function toggleHerd(id){const s=S.herd.find(x=>x.id===id);s.active=!s.active;save();render()}function deleteHerd(id){S.herd=S.herd.filter(x=>x.id!==id);save();render()}function editHerd(id){const s=S.herd.find(x=>x.id===id);modal(`<h3>Edit Herd Animal</h3><div class="grid g2 mobile2">${field('Name',s.name,'name')}${field('Sex',s.sex,'sex')}${field('L Ear',s.lEar,'lEar')}${field('R Ear',s.rEar,'rEar')}${field('Birthdate',s.birthdate,'birthdate','date')}${field('Breed',s.breed,'breed')}${field('Sire',s.sire,'sire')}${field('Dam',s.dam,'dam')}${field('Breeder',s.breeder,'breeder')}</div>${field('Notes',s.notes,'notes')}<div class="row" style="justify-content:flex-end"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="saveHerdEdit('${id}')">Save</button></div>`)}function saveHerdEdit(id){const s=S.herd.find(x=>x.id===id);document.querySelectorAll('[data-k]').forEach(i=>s[i.dataset.k]=i.value);save();closeModal();render()}
function renderBreeding(){return `<div class="card"><div class="row between"><div><h2 class="section-title">Breeding Records</h2><div class="muted">Buck Used is a typeable field so outside or unnamed sires can be entered.</div></div><button class="small-btn dark" onclick="breedModal()">＋ Add Breeding Record</button></div>${S.breeding.length?S.breeding.map(b=>`<div class="history"><div class="row between"><div><strong>${esc(b.ewe)}</strong> · ${b.breedingDate||'No date'}</div><div><button class="small-btn" onclick="editBreed('${b.id}')">Edit</button> <button class="small-btn danger" onclick="deleteBreed('${b.id}')">Delete</button></div></div><div class="muted" style="margin-top:5px">Via: ${esc(b.via)} · Buck Used: ${esc(b.buck||'—')} · Expected lambing: ${b.breedingDate?addDays(b.breedingDate,147):'—'} · Ultrasound: ${esc(b.ultrasound||'—')}</div></div>`).join(''):'<div class="empty">No breeding records yet.</div>'}</div>`}
function breedModal(existing){const b=existing||blankBreed(),ew=S.herd.filter(x=>x.sex==='Ewe');modal(`<h3>${existing?'Edit':'Add'} Breeding Record</h3><div class="grid g2 mobile2"><div class="field"><div class="label">Ewe</div><select id="bEwe" class="select"><option value="">Select ewe</option>${ew.map(e=>`<option value="${esc(e.name)}" ${b.ewe===e.name?'selected':''}>${esc(e.name||'Unnamed')}</option>`).join('')}</select></div>${field('Ewe Tag',b.eweTag,'bTag')}${field('Breeding Date',b.breedingDate,'bDate','date')}${field('Via',b.via,'bVia')}${field('Buck Used',b.buck,'bBuck')}${field('Ultrasound',b.ultrasound,'bUltra')}${field('Actual Lambing',b.actualLambing,'bActual','date')}${field('Carried to Term',b.carriedToTerm,'bCtt')}${field('Born Alive',b.bornAlive,'bAlive')}${field('Males',b.males,'bM')}${field('Females',b.females,'bF')}</div>${field('Notes',b.notes,'bNotes')}<div class="row" style="justify-content:flex-end"><button class="small-btn" onclick="closeModal()">Cancel</button><button class="small-btn dark" onclick="saveBreed('${existing?.id||''}')">Save</button></div>`)}function saveBreed(id){const a=S.breeding,b=id?a.find(x=>x.id===id):blankBreed();b.ewe=document.getElementById('bEwe').value;[['eweTag','bTag'],['breedingDate','bDate'],['via','bVia'],['buck','bBuck'],['ultrasound','bUltra'],['actualLambing','bActual'],['carriedToTerm','bCtt'],['bornAlive','bAlive'],['males','bM'],['females','bF'],['notes','bNotes']].forEach(([k,id])=>b[k]=document.querySelector('[data-k="'+id+'"]')?.value||'');if(!id)a.push(b);save();closeModal();render()}function editBreed(id){breedModal(S.breeding.find(x=>x.id===id))}function deleteBreed(id){S.breeding=S.breeding.filter(x=>x.id!==id);save();render()}
function printReport(){const ex=exForYear(),sh=sheepForYear(),w=yrWeights(),f=yrFeeds(),shows=yrShows(),res=yrResults();const area=document.createElement('div');area.className='print-area';area.innerHTML=`<h1 class="serif">GEHRET SHEEP CO — ${esc(S.year)}</h1><h2>Exhibitor</h2><p>${esc(ex.name)} · ${esc(ex.club4h)} · Age ${esc(ex.age)} · ${esc(ex.county)} County</p><h2>Sheep Roster</h2><table class="table">${sh.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.sex)}</td><td>${esc(s.breed)}</td><td>${esc(s.sire)}</td><td>${esc(s.dam)}</td><td>${esc(s.showman)}</td></tr>`).join('')}</table><h2>Weights</h2>${sh.map(s=>`<p><strong>${esc(s.name)}</strong>: ${(w[s.id]||[]).map(x=>esc(x.date)+': '+esc(x.weight)+' lbs').join(', ')||'No weigh-ins'}</p>`).join('')}<h2>Current Feed Program</h2>${sh.map(s=>`<p><strong>${esc(s.name)}</strong>: ${esc(feedAmount(currentFeed(s.id)||{}))}</p>`).join('')}<h2>Show Calendar</h2>${shows.map(s=>`<p><strong>${esc(s.name)}</strong> — ${esc(s.date)} — Sheep: ${(s.sheepIds||[]).map(id=>esc(sh.find(x=>x.id===id)?.name||'')).join(', ')}</p>`).join('')}<h2>Show Results</h2>${res.map(r=>`<p>${esc(r.showName)} — ${esc(r.exhibitor)} — ${esc(sh.find(x=>x.id===r.sheepId)?.name||'')} — ${esc(r.showedAs)} — ${esc(r.placing)}</p>`).join('')}`;document.body.appendChild(area);window.print();setTimeout(()=>area.remove(),500)}
function exportExcel(){const sh=sheepForYear(),w=yrWeights(),f=yrFeeds(),shows=yrShows(),res=yrResults(),rows=sh.map(s=>({Sheep:s.name,Sex:s.sex,Birthdate:s.birthdate,Breed:s.breed,Sire:s.sire,Dam:s.dam,Showman:s.showman})),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Roster');const wr=[];sh.forEach(s=>(w[s.id]||[]).forEach(x=>wr.push({Sheep:s.name,Date:x.date,Weight:x.weight})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wr),'Weights');const fr=[];sh.forEach(s=>(f[s.id]||[]).forEach(x=>fr.push({Sheep:s.name,Date:x.date,Feed:x.feed?.product,FeedLbs:x.feed?.lbs,FeedOz:x.feed?.oz,Supplement:x.supp?.product,SupplementOz:x.supp?.oz,DrenchCc:x.drench?.cc,HayHandfuls:x.hay?.handfuls,Additional:x.extra})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(fr),'Feeds');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(shows.map(s=>({Show:s.name,City:s.city,State:s.state,Date:s.date,Judge:s.judge,Sheep:(s.sheepIds||[]).map(id=>sh.find(x=>x.id===id)?.name).filter(Boolean).join(', '),Exhibitors:(s.exhibitorIds||[]).join(', ')}))),'Show Calendar');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(res.map(r=>({Show:r.showName,Exhibitor:r.exhibitor,Sheep:sh.find(s=>s.id===r.sheepId)?.name||'',ShowedAs:r.showedAs,Placing:r.placing}))),'Show Results');XLSX.writeFile(wb,`Gehret Sheep Co - ${S.year}.xlsx`)}
render();
</script></body></html>
