const base={section:'show',tab:'roster',years:[String(new Date().getFullYear())],year:String(new Date().getFullYear()),exhibitors:[],sheep:[],weights:{},feeds:{},feedCatalog:[],shows:[],results:[],health:{},herd:[],breeding:[]};let S=load();function load(){try{const x={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')};x.years=Array.isArray(x.years)&&x.years.length?x.years:base.years;x.year=x.year||x.years[0];x.exhibitors=Array.isArray(x.exhibitors)?x.exhibitors.flatMap(e=>e?.data?[{...e.data,id:e.data.id||uid(),year:e.year||x.year}]:e):[];x.sheep=Array.isArray(x.sheep)?x.sheep:[];x.herd=Array.isArray(x.herd)?x.herd:[];x.breeding=Array.isArray(x.breeding)?x.breeding:[];x.feedCatalog=Array.isArray(x.feedCatalog)?x.feedCatalog:[];return x}catch{return {...base}}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}function exs(){return S.exhibitors.filter(e=>String(e.year||S.year)===String(S.year))}function shs(){return S.sheep.filter(s=>String(s.year||S.year)===String(S.year))}function shows(){return S.shows.filter(s=>String(s.year||S.year)===String(S.year))}function results(){return S.results.filter(s=>String(s.year||S.year)===String(S.year))}function wh(id){return(S.weights[S.year]?.[id])||[]}function fh(id){return(S.feeds[S.year]?.[id])||[]}function setFH(id,a){if(!S.feeds[S.year])S.feeds[S.year]={};S.feeds[S.year][id]=a;save()}function catalog(){return STARTER.concat(S.feedCatalog||[])}
function F(label,html){return`<div class="field"><div class="label">${label}</div>${html}</div>`}function opts(a,v){return a.map(x=>`<option value="${esc(x)}" ${String(x)===String(v)?'selected':''}>${esc(x)}</option>`).join('')}function B(t,fn,c='btn'){return`<button type="button" class="${c}" onclick="${fn}">${t}</button>`}

function showRoster(){const ex=exs(),sheep=shs();return`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Exhibitor Roster</h2><div class="muted">Save exhibitors independently. Sheep can be assigned afterward.</div></div>${B('+ Add Exhibitor','openEx()','btn dark')}</div>${ex.length?`<div class="list" style="margin-top:12px">${ex.map(e=>`<div class="item"><div class="row" style="justify-content:space-between"><div><strong>${esc(e.name)}</strong><div class="muted">Age ${esc(e.age||'—')} · County ${esc(e.county||'—')} · ${e.sheepIds?.length||0} sheep</div></div><div class="row">${B('Edit',`openEx(${JSON.stringify(e.id)})`)}${B('Delete',`delEx(${JSON.stringify(e.id)})`,'btn danger')}</div></div></div>`).join('')}</div>`:'<div class="empty">No exhibitors saved yet.</div>'}</div><div class="card"><div class="row" style="justify-content:space-between"><div><h2>Sheep Roster (${sheep.length})</h2><div class="muted">Sheep entered for ${esc(S.year)}.</div></div>${B('+ Add Sheep','openSheep()','btn dark')}</div>${sheep.length?`<div class="tablewrap" style="margin-top:10px"><table class="table"><thead><tr><th>Name</th><th>Sex</th><th>Showman</th><th>Active</th><th></th></tr></thead><tbody>${sheep.map(s=>`<tr><td><strong>${esc(s.name)}</strong><div class="muted">${esc(s.breed||'')}</div></td><td>${esc(s.sex)}</td><td>${esc(ex.find(e=>e.id===s.showman)?.name||'—')}</td><td><span class="pill">${s.active===false?'Inactive':'Active'}</span></td><td>${B('Edit',`openSheep(${JSON.stringify(s.id)})`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No sheep saved yet.</div>'}</div>`}

function delEx(id){if(!confirm('Delete this exhibitor?'))return;S.exhibitors=S.exhibitors.filter(e=>e.id!==id);S.sheep.forEach(s=>{if(s.showman===id)s.showman=''});save();render()}
function openSheep(id=''){const s=id?shs().find(x=>x.id===id):{id:uid(),name:'',sex:'Wether',lEar:'',rEar:'',birthdate:'',breed:'',sire:'',dam:'',breeder:'',price:'',showman:'',county:'',notes:'',active:true,targetWeight:'',targetDate:''};modal(`<h2>${id?'Edit':'Add'} Sheep</h2><div class="grid g2">${F('Name',`<input id="s_name" class="input" value="${esc(s.name)}" autocomplete="off">`)}${F('Sex',`<select id="s_sex" class="select">${opts(SEXES,s.sex)}</select>`)}${F('L Ear',`<input id="s_le" class="input" value="${esc(s.lEar)}">`)}${F('R Ear',`<input id="s_re" class="input" value="${esc(s.rEar)}">`)}${F('Birthdate',`<input id="s_birth" class="input" type="date" value="${esc(s.birthdate)}">`)}${F('Breed',`<select id="s_breed" class="select"><option value="">Select breed</option>${opts(BREEDS,s.breed)}</select>`)}${F('Sire',`<input id="s_sire" class="input" value="${esc(s.sire)}">`)}${F('Dam',`<input id="s_dam" class="input" value="${esc(s.dam)}">`)}${F('Breeder',`<input id="s_breeder" class="input" value="${esc(s.breeder)}">`)}${F('Price',`<input id="s_price" class="input" inputmode="decimal" value="${esc(s.price)}">`)}${F('Showman',`<select id="s_showman" class="select"><option value="">Select showman</option>${exs().map(e=>`<option value="${esc(e.id)}" ${e.id===s.showman?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`)}${F('County',`<input id="s_county" class="input" value="${esc(s.county)}">`)}${F('Target Weight',`<input id="s_tw" class="input" inputmode="decimal" value="${esc(s.targetWeight)}">`)}${F('Target Date',`<input id="s_td" class="input" type="date" value="${esc(s.targetDate)}">`)}${F('Active',`<select id="s_active" class="select"><option value="true" ${s.active!==false?'selected':''}>Yes</option><option value="false" ${s.active===false?'selected':''}>No</option></select>`)}</div>${F('Notes',`<textarea id="s_notes" class="textarea">${esc(s.notes)}</textarea>`)}<div class="modalactions">${B('Cancel','closeModal()')}${B('Save Sheep',`saveSheep(${JSON.stringify(s.id)})`,'btn dark')}</div>`)}
function saveSheep(id){const name=document.getElementById('s_name')?.value.trim();if(!name){toast('Enter a sheep name');return}const old=S.sheep.find(s=>s.id===id);const s={id,year:S.year,name,sex:document.getElementById('s_sex').value,lEar:document.getElementById('s_le').value,rEar:document.getElementById('s_re').value,birthdate:document.getElementById('s_birth').value,breed:document.getElementById('s_breed').value,sire:document.getElementById('s_sire').value,dam:document.getElementById('s_dam').value,breeder:document.getElementById('s_breeder').value,price:document.getElementById('s_price').value,showman:document.getElementById('s_showman').value,county:document.getElementById('s_county').value,targetWeight:document.getElementById('s_tw').value,targetDate:document.getElementById('s_td').value,active:document.getElementById('s_active').value==='true',notes:document.getElementById('s_notes').value};const i=S.sheep.findIndex(x=>x.id===id);if(i<0)S.sheep.push(s);else S.sheep[i]=s;if(old?.showman&&old.showman!==s.showman){const p=S.exhibitors.find(e=>e.id===old.showman);if(p)p.sheepIds=(p.sheepIds||[]).filter(x=>x!==id)}const ex=S.exhibitors.find(e=>e.id===s.showman);if(ex&&!ex.sheepIds.includes(id))ex.sheepIds.push(id);save();closeModal();toast('Sheep saved');render()}
function weightsView(){return`<div class="card"><h2>Weights</h2><div class="muted">Select a sheep to enter weights. The graph is designed for phone display.</div><div class="animalgrid" style="margin-top:10px">${shs().map(s=>`<button type="button" class="animal" onclick="weightModal(${JSON.stringify(s.id)})"><h3>${esc(s.name)}</h3><p>${esc(s.sex)} · ${esc(s.breed||'')}</p><p>${wh(s.id).length} records</p></button>`).join('')||'<div class="empty">Add sheep first.</div>'}</div></div>`}
function weightModal(id){const s=shs().find(x=>x.id===id),a=wh(id).slice().sort((x,y)=>x.date.localeCompare(y.date));modal(`<h2>${esc(s?.name)} — Weights</h2><div class="grid g2">${F('Date',`<input id="wd" class="input" type="date" value="${today()}">`)}${F('Weight (lb)',`<input id="wv" class="input" inputmode="decimal">`)}</div><div class="modalactions">${B('Add Weight',`addWeight(${JSON.stringify(id)})`,'btn dark')}</div>${a.length?`<svg class="chart" viewBox="0 0 700 290" preserveAspectRatio="none">${weightSvg(a)}</svg>`:'<div class="empty">No weights recorded yet.</div>'}<div class="list">${a.slice().reverse().map(r=>`<div class="item row" style="justify-content:space-between"><span>${esc(r.date)}</span><strong>${r.weight} lb</strong>${B('Delete',`deleteWeight(${JSON.stringify(id)},${JSON.stringify(r.id)})`,'btn danger')}</div>`).join('')}</div>`)}
function weightSvg(a){const W=700,H=290,p={l:42,r:14,t:18,b:35},v=a.map(x=>+x.weight),mn=Math.floor(Math.min(...v)/5)*5-5,mx=Math.ceil(Math.max(...v)/5)*5+5,x=i=>p.l+(a.length===1?(W-p.l-p.r)/2:(W-p.l-p.r)*i/(a.length-1)),y=z=>p.t+(H-p.t-p.b)-(z-mn)/(mx-mn)*(H-p.t-p.b);let g='';for(let i=0;i<5;i++){let z=mn+(mx-mn)*i/4,yy=y(z);g+=`<line x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}" stroke="#eee9dd"/><text x="5" y="${yy+4}">${z.toFixed(0)}</text>`}let path=a.map((r,i)=>(i?'L':'M')+x(i)+','+y(r.weight)).join('');return g+`<path d="${path}" fill="none" stroke="#b8963f" stroke-width="3"/>`+a.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.weight)}" r="4" fill="#b8963f"/><text x="${x(i)}" y="278" text-anchor="middle">${esc(r.date.slice(5))}</text>`).join('')}
function addWeight(id){const v=document.getElementById('wv').value,d=document.getElementById('wd').value;if(!v||!d)return;S.weights[S.year]??={};S.weights[S.year][id]??=[];S.weights[S.year][id].push({id:uid(),date:d,weight:+v});save();weightModal(id)}function deleteWeight(id,rid){S.weights[S.year][id]=wh(id).filter(x=>x.id!==rid);save();weightModal(id)}
function feedsView(){return`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Feeds</h2><div class="muted">The roster shows the current feed/supplements. Every change is kept with its date.</div></div>${B('+ Add Custom Feed','customFeed()','btn dark')}</div><div class="animalgrid" style="margin-top:12px">${shs().map(s=>{const h=fh(s.id).slice().sort((a,b)=>b.date.localeCompare(a.date)),r=h[0];return`<button type="button" class="animal" onclick="feedModal(${JSON.stringify(s.id)})"><h3>${esc(s.name)}</h3><p>Feed: ${esc(r?.feedName||'—')} ${r?.feedLbs||r?.feedOz?`· ${esc(r.feedLbs||0)} lb ${esc(r.feedOz||0)} oz`:''}</p><p>Supplement: ${esc(r?.supplementOz||'—')} oz · Drench: ${esc(r?.drenchCc||'—')} cc</p><p>Hay: ${esc(r?.hay||'—')} handfuls</p></button>`}).join('')||'<div class="empty">Add sheep first.</div>'}</div></div>`}
function customFeed(){modal(`<h2>Add Custom Feed</h2><div class="muted">This product will be saved permanently to your Feed Catalogue and will appear for every sheep.</div><div class="grid g2" style="margin-top:10px">${F('Company',`<input id="cf_company" class="input" placeholder="Company / manufacturer">`)}${F('Product Name',`<input id="cf_name" class="input" placeholder="Product name">`)}${F('Type',`<select id="cf_type" class="select"><option>Feed</option><option>Supplement</option><option>Drench</option><option>Hay</option></select>`)}${F('Crude Protein',`<input id="cf_cp" class="input" placeholder="Example: 18%">`)}${F('Fat',`<input id="cf_fat" class="input" placeholder="Example: 5%">`)}${F('Fiber',`<input id="cf_fib" class="input" placeholder="Example: 10%">`)}</div>${F('First 3 Ingredients',`<input id="cf_ing" class="input" placeholder="Ingredient 1, Ingredient 2, Ingredient 3">`)}${F('Intended Use',`<textarea id="cf_use" class="textarea" placeholder="How and when you use this product"></textarea>`)}<div class="modalactions">${B('Cancel','closeModal()')}${B('Save to Feed Catalogue','saveCustomFeed()','btn dark')}</div>`)}
function saveCustomFeed(){const company=document.getElementById('cf_company').value.trim(),name=document.getElementById('cf_name').value.trim();if(!company||!name){toast('Company and product name are required');return}S.feedCatalog??=[];S.feedCatalog.push({id:uid(),company,name,type:document.getElementById('cf_type').value,cp:document.getElementById('cf_cp').value,fat:document.getElementById('cf_fat').value,fib:document.getElementById('cf_fib').value,ingredients:document.getElementById('cf_ing').value,use:document.getElementById('cf_use').value});save();closeModal();toast('Custom feed saved to catalogue');render()}
function feedModal(id){const s=shs().find(x=>x.id===id),h=fh(id).slice().sort((a,b)=>b.date.localeCompare(a.date)),cat=catalog();modal(`<h2>${esc(s?.name)} — Feed Log</h2><div class="grid g2">${F('Date',`<input id="fd" class="input" type="date" value="${today()}">`)}${F('Feed',`<select id="ff" class="select"><option value="">Select feed</option>${cat.map(f=>`<option value="${esc(f.id)}">${esc(f.company+' — '+f.name)}</option>`).join('')}</select>`)}${F('Feed (lb)',`<input id="flb" class="input" inputmode="decimal">`)}${F('Feed (oz)',`<input id="foz" class="input" inputmode="decimal">`)}${F('Supplements (oz)',`<input id="fso" class="input" inputmode="decimal">`)}${F('Drench (cc)',`<input id="fdc" class="input" inputmode="decimal">`)}${F('Hay (handfuls)',`<input id="fhy" class="input" inputmode="decimal">`)}${F('Additional',`<input id="fad" class="input">`)}</div><div id="finfo"></div><div class="modalactions">${B('Save Feed Change',`saveFeed(${JSON.stringify(id)})`,'btn dark')}</div><h3 style="margin-top:17px">History</h3><div class="list">${h.map(r=>`<div class="item"><div class="row" style="justify-content:space-between"><strong>${esc(r.date)}</strong>${B('Delete',`deleteFeed(${JSON.stringify(id)},${JSON.stringify(r.id)})`,'btn danger')}</div><div class="muted">${esc(r.feedName||'—')} · ${esc(r.feedLbs||0)} lb ${esc(r.feedOz||0)} oz · Supplement ${esc(r.supplementOz||'—')} oz · Drench ${esc(r.drenchCc||'—')} cc · Hay ${esc(r.hay||'—')} handfuls</div></div>`).join('')||'<div class="empty">No feed history.</div>'}</div>`);document.getElementById('ff').addEventListener('change',feedInfo)}
function feedInfo(){const f=catalog().find(x=>x.id===document.getElementById('ff').value);document.getElementById('finfo').innerHTML=f?`<div class="feedinfo"><strong>${esc(f.company)} — ${esc(f.name)}</strong><br>Protein: ${esc(f.cp||'—')} · Fat: ${esc(f.fat||'—')} · Fiber: ${esc(f.fib||'—')}<br>First 3 ingredients: ${esc(f.ingredients||'—')}<br>Intended use: ${esc(f.use||'—')}</div>`:''}
function saveFeed(id){const f=catalog().find(x=>x.id===document.getElementById('ff').value);if(!f){toast('Select a feed');return}const r={id:uid(),date:document.getElementById('fd').value||today(),feedName:f.company+' — '+f.name,feedLbs:document.getElementById('flb').value,feedOz:document.getElementById('foz').value,supplementOz:document.getElementById('fso').value,drenchCc:document.getElementById('fdc').value,hay:document.getElementById('fhy').value,additional:document.getElementById('fad').value};setFH(id,fh(id).concat(r));feedModal(id)}function deleteFeed(id,rid){setFH(id,fh(id).filter(x=>x.id!==rid));feedModal(id)}
function healthView(){return`<div class="card"><h2>Health Records</h2><div class="animalgrid">${shs().map(s=>`<button type="button" class="animal" onclick="healthModal(${JSON.stringify(s.id)})"><h3>${esc(s.name)}</h3><p>${S.health[S.year]?.[s.id]?.length||0} record(s)</p></button>`).join('')||'<div class="empty">Add sheep first.</div>'}</div></div>`}function healthModal(id){const s=shs().find(x=>x.id===id),a=S.health[S.year]?.[id]||[];modal(`<h2>${esc(s?.name)} — Health</h2><div class="grid g2">${F('Date',`<input id="hd" class="input" type="date" value="${today()}">`)}${F('Type',`<select id="ht" class="select"><option>Vaccination</option><option>Dewormer</option><option>Treatment</option><option>Other</option></select>`)}${F('Product',`<input id="hp" class="input">`)}${F('Dose',`<input id="hdo" class="input">`)}</div>${F('Notes',`<textarea id="hn" class="textarea"></textarea>`)}<div class="modalactions">${B('Save Record',`saveHealth(${JSON.stringify(id)})`,'btn dark')}</div><div class="list">${a.slice().reverse().map(r=>`<div class="item"><strong>${esc(r.date)}</strong> · ${esc(r.type)}<div class="muted">${esc(r.product)} ${esc(r.dose||'')}<br>${esc(r.notes||'')}</div></div>`).join('')||'<div class="empty">No records.</div>'}</div>`)}function saveHealth(id){S.health[S.year]??={};S.health[S.year][id]??=[];S.health[S.year][id].push({id:uid(),date:document.getElementById('hd').value,type:document.getElementById('ht').value,product:document.getElementById('hp').value,dose:document.getElementById('hdo').value,notes:document.getElementById('hn').value});save();healthModal(id)}
function calendarView(){return`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Show Calendar</h2><div class="muted">Select exhibitors and sheep going to each show. No status or entry-deadline fields.</div></div>${B('+ Add Show','showModal()','btn dark')}</div><div class="list" style="margin-top:12px">${shows().map(s=>`<div class="item"><div class="row" style="justify-content:space-between"><div><strong>${esc(s.name)}</strong><div class="muted">${esc(s.date||'No date')} · ${esc(s.city||'')} ${esc(s.state||'')}</div></div>${B('Edit',`showModal(${JSON.stringify(s.id)})`)}</div></div>`).join('')||'<div class="empty">No shows entered.</div>'}</div></div>`}function showModal(id=''){const s=id?shows().find(x=>x.id===id):{id:uid(),name:'',date:'',city:'',state:'',exhibitorIds:[],sheepIds:[],notes:''};modal(`<h2>${id?'Edit':'Add'} Show</h2><div class="grid g2">${F('Show Name',`<input id="shn" class="input" value="${esc(s.name)}">`)}${F('Date',`<input id="shd" class="input" type="date" value="${esc(s.date)}">`)}${F('City',`<input id="shc" class="input" value="${esc(s.city)}">`)}${F('State',`<input id="shs" class="input" value="${esc(s.state)}">`)}</div><div class="grid g2"><div>${F('Exhibitors Going',`<div class="checklist">${exs().map(e=>`<label class="check"><input class="sex" type="checkbox" value="${e.id}" ${(s.exhibitorIds||[]).includes(e.id)?'checked':''}>${esc(e.name)}</label>`).join('')}</div>`)}</div><div>${F('Sheep Going',`<div class="checklist">${shs().map(x=>`<label class="check"><input class="ssheep" type="checkbox" value="${x.id}" ${(s.sheepIds||[]).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')}</div>`)}</div></div>${F('Notes',`<textarea id="shnots" class="textarea">${esc(s.notes)}</textarea>`)}<div class="modalactions">${B('Cancel','closeModal()')}${B('Save Show',`saveShow(${JSON.stringify(s.id)})`,'btn dark')}</div>`)}function saveShow(id){const s={id,year:S.year,name:document.getElementById('shn').value,date:document.getElementById('shd').value,city:document.getElementById('shc').value,state:document.getElementById('shs').value,exhibitorIds:[...document.querySelectorAll('.sex:checked')].map(x=>x.value),sheepIds:[...document.querySelectorAll('.ssheep:checked')].map(x=>x.value),notes:document.getElementById('shnots').value};const i=S.shows.findIndex(x=>x.id===id);if(i<0)S.shows.push(s);else S.shows[i]=s;save();closeModal();render()}
function resultsView(){const r=results();return`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Show Results</h2><div class="muted">Results use current exhibitors and sheep.</div></div>${B('+ Add Result','resultModal()','btn dark')}</div><div class="tablewrap" style="margin-top:10px"><table class="table"><thead><tr><th>Show</th><th>Exhibitor</th><th>Sheep</th><th>Showed As</th><th>Placing</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.showName)}</td><td>${esc(exs().find(e=>e.id===x.exhibitor)?.name||x.exhibitor)}</td><td>${esc(shs().find(s=>s.id===x.sheepId)?.name||x.sheepId)}</td><td>${esc(x.showedAs)}</td><td>${esc(x.placing)}</td></tr>`).join('')}</tbody></table></div>${!r.length?'<div class="empty">No results entered.</div>':''}</div>`}function resultModal(){modal(`<h2>Add Show Result</h2>${F('Show Name',`<input id="rn" class="input">`)}<div class="grid g2">${F('Exhibitor',`<select id="re" class="select"><option value="">Select exhibitor</option>${exs().map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>`)}${F('Sheep',`<select id="rs" class="select"><option value="">Select sheep</option>${shs().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`)}${F('Showed As',`<input id="ra" class="input">`)}${F('Placing',`<input id="rp" class="input">`)}</div><div class="modalactions">${B('Cancel','closeModal()')}${B('Save Result','saveResult()','btn dark')}</div>`)}function saveResult(){S.results.push({id:uid(),year:S.year,showName:document.getElementById('rn').value,exhibitor:document.getElementById('re').value,sheepId:document.getElementById('rs').value,showedAs:document.getElementById('ra').value,placing:document.getElementById('rp').value});save();closeModal();render()}
function herdRoster(){const a=S.herd.filter(x=>x.active!==false).sort((x,y)=>String(x.birthdate||'').localeCompare(String(y.birthdate||''))),i=S.herd.filter(x=>x.active===false).sort((x,y)=>String(y.birthdate||'').localeCompare(String(x.birthdate||''))),r=a.concat(i);return`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Herd Roster</h2><div class="muted">Active: oldest to youngest. Inactive: youngest to oldest.</div></div>${B('+ Add Herd Sheep','herdModal()','btn dark')}</div><div class="tablewrap" style="margin-top:10px"><table class="table"><thead><tr><th>Name</th><th>Sex</th><th>Birthdate</th><th>Breed</th><th>Active</th><th></th></tr></thead><tbody>${r.map(s=>`<tr><td><strong>${esc(s.name||'Unnamed')}</strong></td><td>${esc(s.sex)}</td><td>${esc(s.birthdate||'—')}</td><td>${esc(s.breed||'')}</td><td><span class="pill">${s.active===false?'Inactive':'Active'}</span></td><td>${B('Edit',`herdModal(${JSON.stringify(s.id)})`)}</td></tr>`).join('')}</tbody></table></div>${!r.length?'<div class="empty">No herd sheep entered.</div>':''}</div>`}function herdModal(id=''){const s=id?S.herd.find(x=>x.id===id):{id:uid(),name:'',sex:'Ewe',birthdate:'',breed:'',lEar:'',rEar:'',sire:'',dam:'',notes:'',active:true};modal(`<h2>${id?'Edit':'Add'} Herd Sheep</h2><div class="grid g2">${F('Name',`<input id="hn" class="input" value="${esc(s.name)}">`)}${F('Sex',`<select id="hs" class="select">${opts(['Ewe','Ram','Wether'],s.sex)}</select>`)}${F('Birthdate',`<input id="hb" class="input" type="date" value="${esc(s.birthdate)}">`)}${F('Breed',`<select id="hbr" class="select"><option value="">Select breed</option>${opts(BREEDS,s.breed)}</select>`)}${F('L Ear',`<input id="hle" class="input" value="${esc(s.lEar)}">`)}${F('R Ear',`<input id="hre" class="input" value="${esc(s.rEar)}">`)}</div>${F('Sire',`<input id="hsi" class="input" value="${esc(s.sire)}">`)}${F('Dam',`<input id="hda" class="input" value="${esc(s.dam)}">`)}${F('Notes',`<textarea id="hno" class="textarea">${esc(s.notes)}</textarea>`)}${F('Active',`<select id="hac" class="select"><option value="true" ${s.active!==false?'selected':''}>Yes</option><option value="false" ${s.active===false?'selected':''}>No</option></select>`)}<div class="modalactions">${B('Cancel','closeModal()')}${B('Save',`saveHerd(${JSON.stringify(s.id)})`,'btn dark')}</div>`)}function saveHerd(id){const s={id,name:document.getElementById('hn').value,sex:document.getElementById('hs').value,birthdate:document.getElementById('hb').value,breed:document.getElementById('hbr').value,lEar:document.getElementById('hle').value,rEar:document.getElementById('hre').value,sire:document.getElementById('hsi').value,dam:document.getElementById('hda').value,notes:document.getElementById('hno').value,active:document.getElementById('hac').value==='true'};const i=S.herd.findIndex(x=>x.id===id);if(i<0)S.herd.push(s);else S.herd[i]=s;save();closeModal();render()}
function breedingView(){return`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Breeding Records</h2><div class="muted">Buck Used is free text.</div></div>${B('+ Add Breeding Record','breedModal()','btn dark')}</div><div class="tablewrap"><table class="table"><thead><tr><th>Ewe</th><th>Breeding Date</th><th>Via</th><th>Buck Used</th><th>Expected Lambing</th></tr></thead><tbody>${S.breeding.map(r=>`<tr><td>${esc(r.ewe)}</td><td>${esc(r.breedingDate)}</td><td>${esc(r.via)}</td><td>${esc(r.buck)}</td><td>${esc(r.expectedLambing||'—')}</td></tr>`).join('')}</tbody></table></div>${!S.breeding.length?'<div class="empty">No breeding records.</div>':''}</div>`}function breedModal(){modal(`<h2>Add Breeding Record</h2><div class="grid g2">${F('Ewe',`<input id="be" class="input">`)}${F('Ewe Tag',`<input id="bet" class="input">`)}${F('Breeding Date',`<input id="bd" class="input" type="date">`)}${F('Via',`<select id="bv" class="select"><option>A.I.</option><option>Natural</option><option>Embryo Transfer</option></select>`)}${F('Buck Used',`<input id="bb" class="input">`)}${F('Expected Lambing',`<input id="bex" class="input" type="date">`)}${F('Ultrasound',`<input id="bu" class="input">`)}${F('Actual Lambing',`<input id="ba" class="input" type="date">`)}</div>${F('Notes',`<textarea id="bn" class="textarea"></textarea>`)}<div class="modalactions">${B('Cancel','closeModal()')}${B('Save','saveBreed()','btn dark')}</div>`)}function saveBreed(){S.breeding.push({id:uid(),ewe:document.getElementById('be').value,eweTag:document.getElementById('bet').value,breedingDate:document.getElementById('bd').value,via:document.getElementById('bv').value,buck:document.getElementById('bb').value,expectedLambing:document.getElementById('bex').value,ultrasound:document.getElementById('bu').value,actualLambing:document.getElementById('ba').value,notes:document.getElementById('bn').value});save();closeModal();render()}function lambingView(){return`<div class="card"><h2>Lambing</h2><div class="notice">Lambing workspace. Breeding records remain in their own tab.</div></div>`}function learnView(){return`<div class="card"><h2>Learn</h2><div class="list"><div class="item"><strong>Estrous Cycle Basics</strong><div class="muted">Ewes are seasonally polyestrous; a typical cycle is about 17 days.</div></div><div class="item"><strong>Gestation Length</strong><div class="muted">Average gestation is about 147 days.</div></div><div class="item"><strong>Colostrum Timing</strong><div class="muted">Newborn lambs should receive colostrum promptly after birth.</div></div></div></div>`}
