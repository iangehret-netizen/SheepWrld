in:0 0 12px}.card h2{font-size:22px}.card h3{font-size:18px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#969696;margin-bottom:5px}.field{min-width:0}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.input,.select,.textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--black);padding:11px 10px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--gold)}.textarea{min-height:90px;resize:vertical}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.right{margin-left:auto}.list{display:flex;flex-direction:column;gap:7px}.list-item{border:1px solid #eee9dd;border-radius:8px;padding:11px;background:#fff}.list-item.selected{border-color:var(--gold2);background:#fffaf0}.small{font-size:12px}.pill{display:inline-flex;align-items:center;border:1px solid var(--gold2);border-radius:999px;padding:4px 8px;font-size:11px;white-space:nowrap}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8e8e8e;text-align:left;border-bottom:1px solid var(--gold2);padding:8px 6px;white-space:nowrap}.table td{border-bottom:1px solid #eee9dd;padding:9px 6px;vertical-align:top}.empty{text-align:center;padding:28px;color:#999}.notice{background:#fbf6e9;border:1px solid var(--gold2);padding:10px;border-radius:7px;color:#6f6a60;font-size:12px;line-height:1.45}.animal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.animal{border:1px solid #eee9dd;border-radius:8px;padding:11px;background:#fff;text-align:left}.animal.active{border-color:var(--gold2);background:#fffaf0}.animal h3{font:600 18px Georgia,serif;margin:0 0 4px}.animal p{margin:2px 0;color:#777;font-size:12px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(700px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px 15px 0 0;padding:17px}.modal h2{font:600 24px Georgia,serif;margin:0 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}.close{float:right;border:0;background:transparent;font-size:26px;color:#777}.toast{position:fixed;right:12px;bottom:18px;z-index:130;background:var(--black);color:#fff;padding:11px 14px;border-radius:8px;font-size:13px}.checklist{display:grid;gap:7px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:9px}.check{display:flex;gap:8px;align-items:center;padding:7px;border-radius:6px;background:#fafafa}.check input{width:18px;height:18px}.feed-info{background:#fbf6e9;border:1px solid var(--gold2);border-radius:8px;padding:10px;font-size:12px;line-height:1.45}.chart{width:100%;height:310px;display:block;background:#fff;border:1px solid #eee9dd;border-radius:8px}.chart text{font-size:10px;fill:#777}.chart .gridline{stroke:#eee9dd;stroke-width:1}.chart .axis{stroke:#cfc8bb;stroke-width:1}.chart .line{fill:none;stroke:var(--gold);stroke-width:3}.chart .dot{fill:var(--gold)}.hide{display:none!important}@media(min-width:760px){.header{padding:22px}.brand img{width:72px;height:72px}.brand h1{font-size:38px}.actions{margin-top:0}.header-row{align-items:flex-end}.content{padding:22px 24px 80px}.modal-back{align-items:center}.modal{border-radius:12px}}@media(max-width:759px){.g2,.g3,.g4{grid-template-columns:1fr}.g2.mobile2{grid-template-columns:repeat(2,minmax(0,1fr))}.brand h1{font-size:25px}.actions .btn{flex:1 1 calc(50% - 8px);min-width:145px}.season .btn{flex:0 0 auto}.content{overflow-x:hidden}.card{padding:13px}.modal{padding:15px}.animal-grid{grid-template-columns:1fr}.table{ const KEY='gehret-sheep-co-v2',uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const BREEDS=['BFX','WFX','Hampshire','Shropshire','Southdown','Oxford','Dorset','Natural','AOB'],SEXES=['Wether','Ewe Lamb','Ram'],FEED_ORDER=['Formula Of Champions','Show-Rite','Umbarger','Essential','High Noon','Rule','Purina','Sunglo','Sullivan','Kent'];
const FOC=[['Show Star® Show Lamb Feed','Feed','18.00%','3.50%','14.00%','Steam-Flaked Corn, Steam-Rolled Barley, Crimped Oats','A complete, premium textured feed to develop bloom and a firm finish from 80 lbs to show day.'],['Power Take Off (PTO)','Feed','18.00%','5.00%','10.00%','Grain Products, Plant Protein Products (including Roasted Soybeans), Processed Grain By-Products','High-energy, high-fat starter and grower ration to maximize mass, early growth, and heavy bloom.'],['X-Factor Show Lamb Feed','Feed','17.00%','3.50%','14.00%','Steam-Rolled Barley, Crimped Oats, Dehulled Soybean Meal','A unique barley-based finishing feed to add a smooth, firm layer of condition while maintaining a trim appearance.'],['Cherry Krave™ Lamb Creep','Feed','18.00%','5.00%','15.00%','Dehulled Soybean Meal, Ground Corn, Dehydrated Alfalfa Meal','A mini-pellet creep feed with intense cherry aroma to drive high early intake and bloom in baby lambs.'],['Show & Glow Supplement','Supplement','28.00%','3.00%','4.00%','Dehulled Soybean Meal, Dried Whey, Grain Products','A high-protein, nutrient-dense pellet used to optimize muscle building, amino acid profile, skin health, and fleece quality.'],['Afterburner® Topdress','Supplement','51.00%','2.80%','10.00%','Animal Protein Products, Plant Protein Products, Processed Grain By-Products','High-protein additive designed to burn excess cover/fat, shape muscle expression, and make animals firmer to the touch.'],['Hard Drive® Topdress','Supplement','34.00%','3.00%','6.00%','Dehulled Soybean Meal, Animal Protein Products, Processed Grain By-Products','Advanced multi-species topdress to add hard touch, power, and severe structural muscle shape across the top.'],['Fill ’Er Up® Topdress','Supplement','12.00%','3.00%','26.00%','Forage Products, Roughage Products, Processed Grain By-Products','High-fiber pellet that expands in the gut to create visual rib shape, body capacity, and immediate show-day fill.'],['Hair Magic Plus®','Supplement','16.00%','15.00%','12.00%','Forage Products, Processed Grain By-Products, Calcium Carbonate','Melatonin-free skin and coat pellet to build a thicker, high-shine fleece and healthier hide.'],['Moonshine® Liquid/Dry Modifiers','Supplement','Trace (Variable by Base)','99.00%+ (Liquid Oil Blend Base)','0.00%','Crude Soybean Oil, Cane Molasses, Natural/Artificial Flavorings','High-energy calorie boosts and extreme palatability enhancers to stimulate aggressive feeding behavior.']].map(x=>({company:'Formula Of Champions',name:x[0],type:x[1],cp:x[2],fat:x[3],fib:x[4],ingredients:x[5],use:x[6]}));
const SIMPLE=[['Show-Rite','NewCo Lamb Feed D22.7','Feed'],['Show-Rite','NewCo Lamb Creep D22.7','Feed'],['Show-Rite','Fundamental Sheep 14% D22.7','Feed'],['Show-Rite','Colossal','Supplement'],['Show-Rite','Yolked','Supplement'],['Show-Rite','Rite Flex','Supplement'],['Umbarger','Lamb 19% (Top Choice)','Feed'],['Umbarger','Lamb Creep 19%','Feed'],['Umbarger','Lamb Creep 18%','Feed'],['Umbarger','Lamb 17% with Barley','Feed'],['Umbarger','Lamb 16% Hi-Energy','Feed'],['Umbarger','Bulletproof','Supplement'],['Umbarger','Loaded','Supplement'],['Umbarger','Star Glo','Supplement'],['Umbarger','Change Up','Supplement'],['Essential','Essential 417','Feed'],['Essential','Money Maker (Creep)','Feed'],['Essential','Essential 330','Feed'],['Essential','14.5% Ewe Feed','Feed'],['Essential','Repro Plus','Supplement'],['Essential','Sheep & Goat DFM','Supplement'],['Essential','Concept Mineral','Supplement'],['Essential','Torch','Supplement'],['Essential','Chub','Supplement'],['Essential','Foundation','Supplement'],['Essential','Crease','Supplement'],['Essential','Flare','Supplement'],['Essential','Voltage','Supplement'],['Essential','Touch Tone','Supplement'],['Essential','Uni4m','Supplement'],['Essential','Fluff','Supplement'],['Essential','Sasquatch','Supplement'],['Essential','Glisten','Supplement'],['Essential','Equex','Supplement'],['Essential','Composure','Supplement'],['Essential','Belly Down','Supplement'],['High Noon','Show Lamb #104','Feed'],['High Noon','Show Lamb Extreme (HN112)','Feed'],['High Noon','Pro Show Lamb (HN105)','Feed'],['High Noon','Max Start 90 (HN101)','Feed'],['High Noon','Max Start Plus (HN102)','Feed'],['High Noon','Sure Shot (THN123)','Feed'],['High Noon','Monkey Munch (#113)','Feed'],['High Noon','Punch','Feed'],['High Noon','Charmasson','Feed'],['High Noon','36% Ewe & Lamb Supplement (HN110)','Supplement'],['High Noon','HN 506 Sheep Mineral','Supplement'],['High Noon','Extra Fill (HN124)','Supplement'],['High Noon','Original Glo','Supplement'],['High Noon','High Glo','Supplement'],['High Noon','Clean Expression','Supplement'],['High Noon','Shine Em Up','Supplement'],['Rule','Thicc','Supplement'],['Rule','Shredded R','Supplement'],['Rule','The Formula','Supplement'],['Rule','Fresh N Full','Supplement'],['Rule','Swoop','Supplement'],['Rule','Gorge','Supplement'],['Rule','Wintex Punch','Supplement'],['Rule','TotalCare Sheep','Supplement'],['Rule','Struttin','Supplement'],['Rule','Flex Appeal','Supplement'],['Purina','Honor Show Showlamb Creep Pellet DX','Feed'],['Purina','Honor Show Showlamb Creep 20 DX30','Feed'],['Purina','Honor Show Showlamb GR 15 DX TXT','Feed'],['Purina','Honor Show Showlamb Grower 18% DX','Feed'],['Purina','Honor Showlamb Stretch 17 TXT DX','Feed'],['Purina','High Octane Champion Drive Topdress','Supplement'],['Purina','High Octane Fitter 35 Topdress','Supplement'],['Purina','High Octane Power Fuel Extreme Topdress','Supplement'],['Purina','High Octane Heavy Weight Topdress','Supplement'],['Sunglo','Show Lamb','Feed'],['Sunglo','Game On','Supplement'],['Sunglo','Smore Fill','Supplement'],['Sunglo','Full Tank','Supplement'],['Sunglo','Sumo','Supplement'],['Sunglo','4-Sure','Supplement'],['Sunglo','Final Control','Supplement'],['Sunglo','In Motion','Supplement'],['Sunglo','Liquafat','Supplement'],['Sullivan','ShowBloom','Supplement'],['Sullivan','Swell','Supplement'],['Sullivan','Bloom-n-Secret','Supplement'],['Sullivan','Restore Pro','Supplement'],['Sullivan','Appetite Express','Supplement'],['Sullivan','Peace Pellets','Supplement'],['Sullivan','Show Shake','Supplement'],['Kent','Show Lamb Breeze 45DQ','Feed'],['Kent','Show Lamb Gale Force 18DQ','Feed'],['Kent','Show Lamb Gale Force HE 18DQ','Feed'],['Kent','ShowBoss Final Drive','Supplement'],['Kent','ShowBoss Fit N Finish','Supplement'],['Kent','ShowBoss FATfetti','Supplement'],['Kent','ShowBoss Biomend','Supplement'],['Kent','ShowBoss Lowdown','Supplement'],['Kent','ShowBoss Contour','Supplement'],['Kent','ShowBoss Winning Fill','Supplement']].map(x=>({company:x[0],name:x[1],type:x[2]}));
const DEFAULT_CATALOG=FOC.concat(SIMPLE);
const blankSheep=()=>({id:uid(),name:'',sex:'Wether',lEar:'',rEar:'',birthdate:'',breed:'',sire:'',dam:'',breeder:'',price:'',showman:'',county:'',notes:'',active:true,targetWeight:'',targetDate:''}),blankEx=()=>({id:uid(),name:'',age:'',county:'',numSheep:'',targetShow:'',targetShowDate:'',osf:false,sheepIds:[]}),blankShow=()=>({id:uid(),name:'',city:'',state:'',date:'',sheepIds:[],exhibitorIds:[],notes:''}),blankResult=()=>({id:uid(),showName:'',exhibitor:'',sheepId:'',showedAs:'',placing:''}),blankHerd=()=>({id:uid(),name:'',sex:'Ewe',lEar:'',rEar:'',birthdate:'',breed:'',sire:'',dam:'',breeder:'',notes:'',active:true}),blankBreed=()=>({id:uid(),ewe:'',eweTag:'',breedingDate:'',via:'A.I.',buck:'',ultrasound:'',actualLambing:'',carriedToTerm:'',bornAlive:'',males:'',females:'',notes:''});
const base={section:'show',tab:'roster',years:[String(new Date().getFullYear())],year:String(new Date().getFullYear()),exhibitors:[],sheep:[],weights:{},feeds:{},feedCatalog:[],shows:[],results:[],health:{},herd:[],breeding:[]};
let S=load();function load(){try{let x={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')};if(!Array.isArray(x.years)||!x.years.length)x.years=[base.year];if(!x.year)x.year=x.years[0];if(Array.isArray(x.exhibitors))x.exhibitors=x.exhibitors.flatMap(e=>e&&e.data?[{...e.data,id:e.data.id||uid(),year:e.year||x.year}]:e);if(!Array.isArray(x.sheep))x.sheep=[];if(!Array.isArray(x.herd))x.herd=[];if(!Array.isArray(x.breeding))x.breeding=[];return x}catch{return {...base}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}function showEx(){return S.exhibitors.filter(e=>String(e.year)===String(S.year))}function showSheep(){return S.sheep.filter(s=>String(s.year)===String(S.year))}function showShows(){return S.shows.filter(s=>String(s.year)===String(S.year))}function showResults(){return S.results.filter(s=>String(s.year)===String(S.year))}function weightsFor(id){return(S.weights[S.year]&&S.weights[S.year][id])||[]}function feedHistory(id){return(S.feeds[S.year]&&S.feeds[S.year][id])||[]}function setFeedHistory(id,a){if(!S.feeds[S.year])S.feeds[S.year]={};S.feeds[S.year][id]=a;save()}function feedCatalog(){return DEFAULT_CATALOG.concat(S.feedCatalog||[]).sort((a,b)=>{let ai=FEED_ORDER.indexOf(a.company),bi=FEED_ORDER.indexOf(b.company);ai=ai<0?99:ai;bi=bi<0?99:bi;return ai-bi||a.name.localeCompare(b.name)})}function setTab(t){S.tab=t;save();render()}function switchSection(sec){S.section=sec;S.tab='roster';save();render()}function addYear(){const name=prompt('Enter the year/season name (example: 2026 Summer or 2026 Fall):',String(new Date().getFullYear()+1)+' — Spring');if(!name)return;if(!S.years.includes(name))S.years.push(name);S.year=name;save();render()}function chooseYear(y){S.year=y;save();render()}function field(label,html){return`<div class="field"><div class="label">${label}</div>${html}</div>`}function btn(text,fn,cls='btn'){return`<button class="${cls}" onclick="${fn}">${text}</button>`}function optList(options,selected=''){return options.map(o=>`<option value="${esc(o)}" ${String(o)===String(selected)?'selected':''}>${esc(o)}</option>`).join('')}function showmanOptions(selected=''){return`<option value="">Select showman</option>`+showEx().map(e=>`<option value="${esc(e.id)}" ${e.id===selected?'selected':''}>${esc(e.name)}</option>`).join('')}function exhibitorOptions(selected=''){return`<option value="">Select exhibitor</option>`+showEx().map(e=>`<option value="${esc(e.id)}" ${e.id===selected?'selected':''}>${esc(e.name)}</option>`).join('')}function sheepOptions(selected=''){return`<option value="">Select sheep</option>`+showSheep().map(s=>`<option value="${esc(s.id)}" ${s.id===selected?'selected':''}>${esc(s.name||'Unnamed')}</option>`).join('')}
function render(){document.getElementById('app').innerHTML=`<header class="header"><div class="wrap"><div class="header-row"><div class="brand"><img src="apple-touch-icon.png"><div><div class="eyebrow">Sheep Records</div><h1>GEHRET SHEEP CO</h1></div></div><div class="actions no-print">${btn('Show Barn',"switchSection('show')",S.section==='show'?'btn primary':'btn ghost')}${btn('Herd',"switchSection('herd')",S.section==='herd'?'btn primary':'btn ghost')}</div></div>${S.section==='show'?`<div class="season no-print"><span>Season:</span>${S.years.map(y=>btn(esc(y),`chooseYear(${JSON.stringify(y)})`,y===S.year?'btn primary':'btn ghost')).join('')}${btn('+ Add Year',"addYear()",'btn dark')}</div>`:''}<div class="actions no-print">${btn('▣ PDF Export',"exportPDF()",'btn dark')}${btn('▤ Excel Export',"exportExcel()",'btn dark')}</div></div></header><nav class="subnav no-print"><div class="wrap tabs">${tabs()}</div></nav><main class="wrap content">${S.section==='show'?showView():herdView()}</main><div id="modalRoot"></div>`}
function tabs(){const arr=S.section==='show'?['roster','weights','feeds','health','calendar','results']:['roster','breeding','lambing','learn'];return arr.map(t=>`<button class="tab ${S.tab===t?'active':''}" onclick="setTab('${t}')">${({roster:'Roster',weights:'Weights',feeds:'Feeds',health:'Health Records',calendar:'Show Calendar',results:'Show Results',breeding:'Breeding Records',lambing:'Lambing',learn:'Learn'})[t]}</button>`).join('')}
function showView(){return({roster:showRoster,weights:weightsView,feeds:feedsView,health:healthView,calendar:calendarView,results:resultsView}[S.tab]||showRoster)()}function herdView(){return({roster:herdRoster,breeding:breedingView,lambing:lambingView,learn:learnView}[S.tab]||herdRoster)()}
function showRoster(){const ex=showEx(),sheep=showSheep();return`<div class="card"><div class="row between"><div><h2>Exhibitor Roster</h2><div class="muted">Exhibitors can be entered and saved by themselves. Sheep can be assigned later.</div></div>${btn('+ Add Exhibitor',"openExModal()",'btn dark')}</div>${ex.length?`<div class="list" style="margin-top:12px">${ex.map(e=>`<div class="list-item"><div class="row between"><div><strong>${esc(e.name)}</strong><div class="muted">Age ${esc(e.age||'—')} · County ${esc(e.county||'—')} · ${e.sheepIds?.length||0} sheep</div></div><div class="row">${btn('Edit',`openExModal(${JSON.stringify(e.id)})`,'btn')}${btn('Delete',`deleteEx(${JSON.stringify(e.id)})`,'btn danger')}</div></div></div>`).join('')}</div>`:'<div class="empty">No exhibitors entered yet.</div>'}</div><div class="card"><div class="row between"><div><h2>Sheep Roster (${sheep.length})</h2><div class="muted">Show Barn sheep for ${esc(S.year)}.</div></div>${btn('+ Add Sheep',"openSheepModal()",'btn dark')}</div>${sheep.length?`<div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Name</th><th>Sex</th><th>Showman</th><th>Active</th><th></th></tr></thead><tbody>${sheep.map(s=>`<tr><td><strong>${esc(s.name||'Unnamed')}</strong><div class="small muted">${esc(s.breed||'')}</div></td><td>${esc(s.sex)}</td><td>${esc(showEx().find(e=>e.id===s.showman)?.name||'—')}</td><td><span class="pill">${s.active===false?'Inactive':'Active'}</span></td><td>${btn('Edit',`openSheepModal(${JSON.stringify(s.id)})`,'btn')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No sheep entered yet.</div>'}</div>`}
function openExModal(id=''){const e=id?showEx().find(x=>x.id===id):blankEx();modal(`<h2>${id?'Edit':'Add'} Exhibitor</h2><div class="grid g2">${field('Exhibitor Name',`<input id="ex_name" class="input" value="${esc(e.name)}">`)}${field('Age',`<input id="ex_age" class="input" inputmode="numeric" value="${esc(e.age)}">`)}${field('County',`<input id="ex_county" class="input" value="${esc(e.county)}">`)}${field('# of Sheep',`<input id="ex_num" class="input" inputmode="numeric" value="${esc(e.numSheep)}">`)}${field('Target Show',`<input id="ex_target" class="input" value="${esc(e.targetShow)}">`)}${field('Target Show Date',`<input id="ex_date" class="input" type="date" value="${esc(e.targetShowDate)}">`)}</div><div class="notice" style="margin-top:10px">4-H Club has been removed. Save the exhibitor first; sheep can be assigned afterward.</div><div class="modal-actions">${btn('Cancel','closeModal()','btn')}${btn('Save Exhibitor',`saveEx(${JSON.stringify(id)})`,'btn dark')}</div>`)}
function saveEx(id){const data={id:id||uid(),year:S.year,name:document.getElementById('ex_name').value.trim(),age:document.getElementById('ex_age').value,county:document.getElementById('ex_county').value,numSheep:document.getElementById('ex_num').value,targetShow:document.getElementById('ex_target').value,targetShowDate:document.getElementById('ex_date').value,osf:false,sheepIds:id?(showEx().find(x=>x.id===id)?.sheepIds||[]):[]};if(!data.name){toast('Enter an exhibitor name');return}const i=S.exhibitors.findIndex(x=>x.id===data.id);if(i>=0)S.exhibitors[i]=data;else S.exhibitors.push(data);save();closeModal();render()}
function deleteEx(id){if(!confirm('Delete this exhibitor? Sheep will remain in the roster.'))return;S.exhibitors=S.exhibitors.filter(e=>e.id!==id);S.sheep.forEach(s=>{if(s.year===S.year&&s.showman===id)s.showman=''});save();render()}
function openSheepModal(id=''){const s=id?showSheep().find(x=>x.id===id):blankSheep();modal(`<h2>${id?'Edit':'Add'} Sheep</h2><div class="grid g2">${field('Name',`<input id="s_name" class="input" value="${esc(s.name)}">`)}${field('Sex',`<select id="s_sex" class="select">${optList(SEXES,s.sex)}</select>`)}${field('L Ear',`<input id="s_le" class="input" value="${esc(s.lEar)}">`)}${field('R Ear',`<input id="s_re" class="input" value="${esc(s.rEar)}">`)}${field('Birthdate',`<input id="s_birth" class="input" type="date" value="${esc(s.birthdate)}">`)}${field('Breed',`<select id="s_breed" class="select"><option value="">Select breed</option>${optList(BREEDS,s.breed)}</select>`)}${field('Sire',`<input id="s_sire" class="input" value="${esc(s.sire)}">`)}${field('Dam',`<input id="s_dam" class="input" value="${esc(s.dam)}">`)}${field('Breeder',`<input id="s_breeder" class="input" value="${esc(s.breeder)}">`)}${field('Price',`<input id="s_price" class="input" inputmode="decimal" value="${esc(s.price)}">`)}${field('Showman',`<select id="s_showman" class="select">${showmanOptions(s.showman)}</select>`)}${field('County',`<input id="s_county" class="input" value="${esc(s.county)}">`)}${field('Target Weight',`<input id="s_targetw" class="input" inputmode="decimal" value="${esc(s.targetWeight)}">`)}${field('Target Date',`<input id="s_targetd" class="input" type="date" value="${esc(s.targetDate)}">`)}${field('Active',`<select id="s_active" class="select"><option value="true" ${s.active!==false?'selected':''}>Yes</option><option value="false" ${s.active===false?'selected':''}>No</option></select>`)}</div>${field('Notes',`<textarea id="s_notes" class="textarea">${esc(s.notes)}</textarea>`)}<div class="modal-actions">${btn('Cancel','closeModal()','btn')}${btn('Save Sheep',`saveSheep(${JSON.stringify(id)})`,'btn dark')}</div>`)}
function saveSheep(id){const old=id?showSheep().find(x=>x.id===id):null;const s={id:id||uid(),year:S.year,name:document.getElementById('s_name').value.trim(),sex:document.getElementById('s_sex').value,lEar:document.getElementById('s_le').value,rEar:document.getElementById('s_re').value,birthdate:document.getElementById('s_birth').value,breed:document.getElementById('s_breed').value,sire:document.getElementById('s_sire').value,dam:document.getElementById('s_dam').value,breeder:document.getElementById('s_breeder').value,price:document.getElementById('s_price').value,showman:document.getElementById('s_showman').value,county:document.getElementById('s_county').value,targetWeight:document.getElementById('s_targetw').value,targetDate:document.getElementById('s_targetd').value,active:document.getElementById('s_active').value==='true',notes:document.getElementById('s_notes').value};if(!s.name){toast('Enter a sheep name');return}const i=S.sheep.findIndex(x=>x.id===s.id);if(i>=0)S.sheep[i]=s;else S.sheep.push(s);const ex=S.exhibitors.find(e=>e.id===s.showman);if(ex&&!ex.sheepIds.includes(s.id))ex.sheepIds.push(s.id);if(old&&old.showman&&old.showman!==s.showman){const prev=S.exhibitors.find(e=>e.id===old.showman);if(prev)prev.sheepIds=(prev.sheepIds||[]).filter(x=>x!==s.id)}save();closeModal();render()}
function weightsView(){const sheep=showSheep();return`<div class="card"><h2>Weights</h2><div class="muted">Select a sheep to enter weights and view its mobile-friendly line graph.</div><div class="animal-grid" style="margin-top:10px">${sheep.map(s=>`<button class="animal" onclick="openWeightModal(${JSON.stringify(s.id)})"><h3>${esc(s.name||'Unnamed')}</h3><p>${esc(s.sex)} · ${esc(s.breed||'')}</p><p>${weightsFor(s.id).length} weight records</p></button>`).join('')}</div>${!sheep.length?'<div class="empty">Add sheep in the Roster first.</div>':''}</div>`}
function openWeightModal(id){const s=showSheep().find(x=>x.id===id),rows=weightsFor(id);modal(`<h2>${esc(s?.name||'Sheep')} — Weights</h2><div class="grid g2">${field('Date',`<input id="w_date" class="input" type="date" value="${today()}">`)}${field('Weight (lb)',`<input id="w_val" class="input" inputmode="decimal" placeholder="0.0">`)}</div><div class="modal-actions">${btn('Add Weight',`addWeight(${JSON.stringify(id)})`,'btn dark')}</div><div style="margin-top:14px">${rows.length?weightChart(rows):'<div class="empty">No weights recorded yet.</div>'}</div><div class="list" style="margin-top:10px">${rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="list-item row between"><span>${esc(r.date)}</span><strong>${esc(r.weight)} lb</strong>${btn('Delete',`deleteWeight(${JSON.stringify(id)},${JSON.stringify(r.id)})`,'btn danger')}</div>`).join('')}</div>`)}
function addWeight(id){const d=document.getElementById('w_date').value,v=document.getElementById('w_val').value;if(!d||!v)return;const arr=weightsFor(id);arr.push({id:uid(),date:d,weight:Number(v)});if(!S.weights[S.year])S.weights[S.year]={};S.weights[S.year][id]=arr;save();openWeightModal(id)}function deleteWeight(id,rid){if(!confirm('Delete this weight?'))return;S.weights[S.year][id]=weightsFor(id).filter(x=>x.id!==rid);save();openWeightModal(id)}
function weightChart(rows){const data=rows.slice().sort((a,b)=>a.date.localeCompare(b.date)),W=680,H=290,p={l:42,r:16,t:18,b:38},iw=W-p.l-p.r,ih=H-p.t-p.b,vals=data.map(x=>Number(x.weight));let min=Math.floor(Math.min(...vals)/5)*5-5,max=Math.ceil(Math.max(...vals)/5)*5+5;if(min===max){min-=10;max+=10}const x=i=>p.l+(data.length===1?iw/2:iw*i/(data.length-1)),y=v=>p.t+ih-(v-min)/(max-min)*ih;let path=data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(d.weight).toFixed(1)).join(''),grid='';for(let i=0;i<=4;i++){let v=min+(max-min)*i/4,yy=y(v);grid+=`<line class="gridline" x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}"/><text x="5" y="${yy+3}">${v.toFixed(0)}</text>`}const dots=data.map((d,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(d.weight)}" r="4"/><text x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(d.date.slice(5))}</text>`).join('');return`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line class="axis" x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${H-p.b}"/>${grid}<path class="line" d="${path}"/>${dots}</svg>`}
function feedsView(){const sheep=showSheep();return`<div class="card"><h2>Feeds</h2><div class="muted">The main view shows only what each sheep is currently being fed. Select an animal to record a change and see its dated history.</div><div class="animal-grid" style="margin-top:12px">${sheep.map(s=>{const h=feedHistory(s.id).slice().sort((a,b)=>b.date.localeCompare(a.date)),cur=h[0];return`<button class="animal" onclick="openFeedModal(${JSON.stringify(s.id)})"><h3>${esc(s.name||'Unnamed')}</h3><p>Feed: ${esc(cur?.feedName||'—')}${cur?(cur.feedLbs||cur.feedOz?` · ${esc(cur.feedLbs||'0')} lb ${esc(cur.feedOz||'0')} oz`:''):''}</p><p>Supplement: ${esc(cur?.supplementOz||'—')} oz · Drench: ${esc(cur?.drenchCc||'—')} cc · Hay: ${esc(cur?.hay||'—')} handfuls</p><p>${h.length} change${h.length===1?'':'s'} recorded</p></button>`}).join('')}</div>${!sheep.length?'<div class="empty">Add sheep in the Roster first.</div>':''}</div>`}
function openFeedModal(id){const s=showSheep().find(x=>x.id===id),hist=feedHistory(id).slice().sort((a,b)=>b.date.localeCompare(a.date)),cat=feedCatalog();modal(`<h2>${esc(s?.name||'Sheep')} — Feed Log</h2>${hist.length?`<div class="notice">Current feed: <strong>${esc(hist[0].feedName||'—')}</strong>. Changes are kept below with their dates.</div>`:''}<div class="grid g2" style="margin-top:10px">${field('Date',`<input id="f_date" class="input" type="date" value="${today()}">`)}${field('Feed',`<select id="f_feed" class="select"><option value="">Select feed</option>${cat.map(f=>`<option value="${esc(f.company+' — '+f.name)}">${esc(f.company+' — '+f.name)}</option>`).join('')}<option value="Custom">Custom</option></select>`)}${field('Feed (lb)',`<input id="f_lbs" class="input" inputmode="decimal" placeholder="0">`)}${field('Feed (oz)',`<input id="f_oz" class="input" inputmode="decimal" placeholder="0">`)}${field('Supplements (oz)',`<input id="f_supp" class="input" inputmode="decimal" placeholder="0">`)}${field('Drench (cc)',`<input id="f_drench" class="input" inputmode="decimal" placeholder="0">`)}${field('Hay (handfuls)',`<input id="f_hay" class="input" inputmode="decimal" placeholder="0">`)}${field('Additional',`<input id="f_add" class="input" placeholder="Optional additional item">`)}</div><div id="feedInfo" style="margin-top:8px"></div><div class="modal-actions">${btn('Save Feed Change',`saveFeed(${JSON.stringify(id)})`,'btn dark')}</div><h3 style="margin-top:18px">History</h3><div class="list">${hist.length?hist.map(r=>`<div class="list-item"><div class="row between"><strong>${esc(r.date)}</strong>${btn('Delete',`deleteFeed(${JSON.stringify(id)},${JSON.stringify(r.id)})`,'btn danger')}</div><div class="small" style="margin-top:5px">Feed: ${esc(r.feedName||'—')} · ${esc(r.feedLbs||'0')} lb ${esc(r.feedOz||'0')} oz<br>Supplement: ${esc(r.supplementOz||'—')} oz · Drench: ${esc(r.drenchCc||'—')} cc · Hay: ${esc(r.hay||'—')} handfuls${r.additional?`<br>Additional: ${esc(r.additional)}`:''}</div></div>`).join(''):'<div class="empty">No feed changes recorded.</div>'}</div>`);document.getElementById('f_feed').addEventListener('change',showFeedInfo)}
function showFeedInfo(){const v=document.getElementById('f_feed').value,p=v.split(' — '),f=feedCatalog().find(x=>x.company===p[0]&&x.name===p.slice(1).join(' — '));document.getElementById('feedInfo').innerHTML=f&&f.ingredients?`<div class="feed-info"><strong>${esc(f.name)}</strong><br>Protein: ${esc(f.cp||'—')} · Fat: ${esc(f.fat||'—')} · Fiber: ${esc(f.fib||'—')}<br>First 3 ingredients: ${esc(f.ingredients)}<br>Intended use: ${esc(f.use)}</div>`:''}
function saveFeed(id){let name=document.getElementById('f_feed').value;if(name==='Custom'){const n=prompt('Enter the custom feed/supplement name:');if(!n)return;name='Custom — '+n}if(!name){toast('Select a feed');return}const r={id:uid(),date:document.getElementById('f_date').value||today(),feedName:name,feedLbs:document.getElementById('f_lbs').value,feedOz:document.getElementById('f_oz').value,supplementOz:document.getElementById('f_supp').value,drenchCc:document.getElementById('f_drench').value,hay:document.getElementById('f_hay').value,additional:document.getElementById('f_add').value};const a=feedHistory(id);a.push(r);setFeedHistory(id,a);openFeedModal(id)}function deleteFeed(id,rid){if(!confirm('Delete this feed record?'))return;setFeedHistory(id,feedHistory(id).filter(x=>x.id!==rid));openFeedModal(id)}
function healthView(){const sheep=showSheep();return`<div class="card"><h2>Health Records</h2><div class="muted">Select a sheep to add or review health records.</div><div class="animal-grid" style="margin-top:10px">${sheep.map(s=>`<button class="animal" onclick="openHealthModal(${JSON.stringify(s.id)})"><h3>${esc(s.name||'Unnamed')}</h3><p>${(S.health[S.year]&&S.health[S.year][s.id]||[]).length} record(s)</p></button>`).join('')}</div>${!sheep.length?'<div class="empty">Add sheep in the Roster first.</div>':''}</div>`}
function openHealthModal(id){const s=showSheep().find(x=>x.id===id),rows=(S.health[S.year]&&S.health[S.year][id]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));modal(`<h2>${esc(s?.name||'Sheep')} — Health</h2><div class="grid g2">${field('Date',`<input id="h_date" class="input" type="date" value="${today()}">`)}${field('Type',`<select id="h_type" class="select">${optList(['Vaccination','Dewormer','Treatment','Other'],'Treatment')}</select>`)}${field('Product',`<input id="h_product" class="input">`)}${field('Dose',`<input id="h_dose" class="input">`)}</div>${field('Notes',`<textarea id="h_notes" class="textarea"></textarea>`)}<div class="modal-actions">${btn('Save Record',`saveHealth(${JSON.stringify(id)})`,'btn dark')}</div><div class="list" style="margin-top:12px">${rows.map(r=>`<div class="list-item"><strong>${esc(r.date)}</strong> · ${esc(r.type)}<div class="small muted">${esc(r.product)} ${r.dose?'· '+esc(r.dose):''}<br>${esc(r.notes||'')}</div></div>`).join('')||'<div class="empty">No records.</div>'}</div>`)}
function saveHealth(id){if(!S.health[S.year])S.health[S.year]={};if(!S.health[S.year][id])S.health[S.year][id]=[];S.health[S.year][id].push({id:uid(),date:document.getElementById('h_date').value||today(),type:document.getElementById('h_type').value,product:document.getElementById('h_product').value,dose:document.getElementById('h_dose').value,notes:document.getElementById('h_notes').value});save();openHealthModal(id)}
function calendarView(){const shows=showShows(),ex=showEx(),sheep=showSheep();return`<div class="card"><div class="row between"><div><h2>Show Calendar</h2><div class="muted">Status and entry deadline have been removed. Select the exhibitors and sheep that are going.</div></div>${btn('+ Add Show',"openShowModal()",'btn dark')}</div>${shows.length?`<div class="list" style="margin-top:12px">${shows.map(sh=>`<div class="list-item"><div class="row between"><div><strong>${esc(sh.name||'Unnamed Show')}</strong><div class="muted">${esc(sh.date||'No date')} · ${esc(sh.city||'')} ${esc(sh.state||'')}</div></div>${btn('Edit',`openShowModal(${JSON.stringify(sh.id)})`,'btn')}</div><div class="small" style="margin-top:6px">Exhibitors: ${(sh.exhibitorIds||[]).map(id=>esc(ex.find(e=>e.id===id)?.name||'')).filter(Boolean).join(', ')||'—'}<br>Sheep: ${(sh.sheepIds||[]).map(id=>esc(sheep.find(s=>s.id===id)?.name||'')).filter(Boolean).join(', ')||'—'}</div></div>`).join('')}</div>`:'<div class="empty">No shows entered.</div>'}</div>`}
function openShowModal(id=''){const sh=id?showShows().find(x=>x.id===id):blankShow(),ex=showEx(),sheep=showSheep();modal(`<h2>${id?'Edit':'Add'} Show</h2><div class="grid g2">${field('Show Name',`<input id="sh_name" class="input" value="${esc(sh.name)}">`)}${field('Date',`<input id="sh_date" class="input" type="date" value="${esc(sh.date)}">`)}${field('City',`<input id="sh_city" class="input" value="${esc(sh.city)}">`)}${field('State',`<input id="sh_state" class="input" value="${esc(sh.state)}">`)}</div><div class="grid g2" style="margin-top:10px"><div>${field('Exhibitors Going',`<div class="checklist">${ex.map(e=>`<label class="check"><input type="checkbox" class="sh_ex" value="${esc(e.id)}" ${(sh.exhibitorIds||[]).includes(e.id)?'checked':''}>${esc(e.name)}</label>`).join('')||'<span class="muted">Enter exhibitors in Roster first.</span>'}</div>`)}</div><div>${field('Sheep Going',`<div class="checklist">${sheep.map(s=>`<label class="check"><input type="checkbox" class="sh_sheep" value="${esc(s.id)}" ${(sh.sheepIds||[]).includes(s.id)?'checked':''}>${esc(s.name||'Unnamed')}</label>`).join('')||'<span class="muted">Enter sheep in Roster first.</span>'}</div>`)}</div></div>${field('Notes',`<textarea id="sh_notes" class="textarea">${esc(sh.notes)}</textarea>`)}<div class="modal-actions">${btn('Cancel','closeModal()','btn')}${btn('Save Show',`saveShow(${JSON.stringify(id)})`,'btn dark')}</div>`)}
function saveShow(id){const sh={id:id||uid(),year:S.year,name:document.getElementById('sh_name').value.trim(),date:document.getElementById('sh_date').value,city:document.getElementById('sh_city').value,state:document.getElementById('sh_state').value,exhibitorIds:[...document.querySelectorAll('.sh_ex:checked')].map(x=>x.value),sheepIds:[...document.querySelectorAll('.sh_sheep:checked')].map(x=>x.value),notes:document.getElementById('sh_notes').value};const i=S.shows.findIndex(x=>x.id===sh.id);if(i>=0)S.shows[i]=sh;else S.shows.push(sh);save();closeModal();render()}
function resultsView(){const rows=showResults(),ex=showEx(),sheep=showSheep();return`<div class="card"><div class="row between"><div><h2>Show Results</h2><div class="muted">Enter results using current exhibitors and sheep from the roster.</div></div>${btn('+ Add Result',"openResultModal()",'btn dark')}</div>${rows.length?`<div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Show</th><th>Exhibitor</th><th>Sheep</th><th>Showed As</th><th>Placing</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.showName)}</td><td>${esc(ex.find(e=>e.id===r.exhibitor)?.name||r.exhibitor)}</td><td>${esc(sheep.find(s=>s.id===r.sheepId)?.name||r.sheepId)}</td><td>${esc(r.showedAs)}</td><td>${esc(r.placing)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No results entered.</div>'}</div>`}
function openResultModal(){modal(`<h2>Add Show Result</h2>${field('Show Name',`<input id="r_show" class="input">`)}<div class="grid g2">${field('Exhibitor',`<select id="r_ex" class="select">${exhibitorOptions()}</select>`)}${field('Sheep',`<select id="r_sheep" class="select">${sheepOptions()}</select>`)}${field('Showed As',`<input id="r_as" class="input" placeholder="Example: Market Lamb">`)}${field('Placing',`<input id="r_place" class="input" placeholder="1st, 2nd, Champion, etc.">`)}</div><div class="modal-actions">${btn('Cancel','closeModal()','btn')}${btn('Save Result','saveResult()','btn dark')}</div>`)}
function saveResult(){const r={id:uid(),year:S.year,showName:document.getElementById('r_show').value,exhibitor:document.getElementById('r_ex').value,sheepId:document.getElementById('r_sheep').value,showedAs:document.getElementById('r_as').value,placing:document.getElementById('r_place').value};if(!r.showName){toast('Enter the show name');return}S.results.push(r);save();closeModal();render()}
function herdRoster(){const a=S.herd.filter(x=>x.active!==false).slice().sort((x,y)=>String(x.birthdate).localeCompare(String(y.birthdate))),i=S.herd.filter(x=>x.active===false).slice().sort((x,y)=>String(y.birthdate).localeCompare(String(x.birthdate))),rows=a.concat(i);return`<div class="card"><div class="row between"><div><h2>Herd Roster</h2><div class="muted">Active sheep are oldest to youngest. Inactive sheep are below them, youngest inactive first.</div></div>${btn('+ Add Herd Sheep',"openHerdModal()",'btn dark')}</div>${rows.length?`<div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Name</th><th>Sex</th><th>Birthdate</th><th>Breed</th><th>Active</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><strong>${esc(s.name||'Unnamed')}</strong></td><td>${esc(s.sex)}</td><td>${esc(s.birthdate||'—')}</td><td>${esc(s.breed||'')}</td><td><span class="pill">${s.active===false?'Inactive':'Active'}</span></td><td>${btn('Edit',`openHerdModal(${JSON.stringify(s.id)})`,'btn')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No herd sheep entered.</div>'}</div>`}
function openHerdModal(id=''){const s=id?S.herd.find(x=>x.id===id):blankHerd();modal(`<h2>${id?'Edit':'Add'} Herd Sheep</h2><div class="grid g2">${field('Name',`<input id="hr_name" class="input" value="${esc(s.name)}">`)}${field('Sex',`<select id="hr_sex" class="select">${optList(['Ewe','Ram','Wether'],s.sex)}</select>`)}${field('Birthdate',`<input id="hr_birth" class="input" type="date" value="${esc(s.birthdate)}">`)}${field('Breed',`<select id="hr_breed" class="select"><option value="">Select breed</option>${optList(BREEDS,s.breed)}</select>`)}${field('L Ear',`<input id="hr_le" class="input" value="${esc(s.lEar)}">`)}${field('R Ear',`<input id="hr_re" class="input" value="${esc(s.rEar)}">`)}</div>${field('Sire',`<input id="hr_sire" class="input" value="${esc(s.sire)}">`)}${field('Dam',`<input id="hr_dam" class="input" value="${esc(s.dam)}">`)}${field('Notes',`<textarea id="hr_notes" class="textarea">${esc(s.notes)}</textarea>`)}${field('Active',`<select id="hr_active" class="select"><option value="true" ${s.active!==false?'selected':''}>Yes</option><option value="false" ${s.active===false?'selected':''}>No</option></select>`)}<div class="modal-actions">${btn('Cancel','closeModal()','btn')}${btn('Save',`saveHerd(${JSON.stringify(id)})`,'btn dark')}</div>`)}
function saveHerd(id){const s={id:id||uid(),name:document.getElementById('hr_name').value,sex:document.getElementById('hr_sex').value,birthdate:document.getElementById('hr_birth').value,breed:document.getElementById('hr_breed').value,lEar:document.getElementById('hr_le').value,rEar:document.getElementById('hr_re').value,notes:document.getElementById('hr_notes').value,active:document.getElementById('hr_active').value==='true',sire:document.getElementById('hr_sire').value,dam:document.getElementById('hr_dam').value};const i=S.herd.findIndex(x=>x.id===s.id);if(i>=0)S.herd[i]=s;else S.herd.push(s);save();closeModal();render()}
function breedingView(){return`<div class="card"><div class="row between"><div><h2>Breeding Records</h2><div class="muted">Buck used can be typed directly.</div></div>${btn('+ Add Breeding Record',"openBreedModal()",'btn dark')}</div>${S.breeding.length?`<div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Ewe</th><th>Breeding Date</th><th>Via</th><th>Buck Used</th><th>Expected Lambing</th></tr></thead><tbody>${S.breeding.map(r=>`<tr><td>${esc(r.ewe)}</td><td>${esc(r.breedingDate)}</td><td>${esc(r.via)}</td><td>${esc(r.buck)}</td><td>${esc(r.expectedLambing||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No breeding records.</div>'}</div>`}
function openBreedModal(){modal(`<h2>Add Breeding Record</h2><div class="grid g2">${field('Ewe',`<input id="b_ewe" class="input">`)}${field('Ewe Tag',`<input id="b_tag" class="input">`)}${field('Breeding Date',`<input id="b_date" class="input" type="date">`)}${field('Via',`<select id="b_via" class="select">${optList(['A.I.','Natural','Embryo Transfer'])}</select>`)}${field('Buck Used',`<input id="b_buck" class="input" placeholder="Type buck name">`)}${field('Expected Lambing',`<input id="b_expected" class="input" type="date">`)}${field('Ultrasound',`<input id="b_ultra" class="input">`)}${field('Actual Lambing',`<input id="b_actual" class="input" type="date">`)}</div>${field('Notes',`<textarea id="b_notes" class="textarea"></textarea>`)}<div class="modal-actions">${btn('Cancel','closeModal()','btn')}${btn('Save','saveBreed()','btn dark')}</div>`)}
function saveBreed(){S.breeding.push({id:uid(),ewe:document.getElementById('b_ewe').value,eweTag:document.getElementById('b_tag').value,breedingDate:document.getElementById('b_date').value,via:document.getElementById('b_via').value,buck:document.getElementById('b_buck').value,expectedLambing:document.getElementById('b_expected').value,ultrasound:document.getElementById('b_ultra').value,actualLambing:document.getElementById('b_actual').value,notes:document.getElementById('b_notes').value});save();closeModal();render()}
function lambingView(){return`<div class="card"><h2>Lambing</h2><div class="notice">Lambing records can be expanded here as needed. Breeding records remain available in their own tab.</div></div>`}function learnView(){return`<div class="card"><h2>Learn</h2><div class="list"><div class="list-item"><strong>Estrous Cycle Basics</strong><div class="muted">Ewes are seasonally polyestrous. A typical cycle is about 17 days.</div></div><div class="list-item"><strong>Gestation Length</strong><div class="muted">Average gestation is about 147 days.</div></div><div class="list-item"><strong>Colostrum Timing</strong><div class="muted">Newborn lambs should receive colostrum promptly after birth.</div></div></div></div>`}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function exportPDF(){const old=document.title;document.title='Gehret Sheep Co — '+S.section+' — '+S.year;window.print();setTimeout(()=>document.title=old,500)}
function exportExcel(){const wb=XLSX.utils.book_new(),ex=showEx(),sheep=showSheep(),rows=sheep.map(s=>({Name:s.name,Sex:s.sex,Breed:s.breed,Showman:ex.find(e=>e.id===s.showman)?.name||'',Birthdate:s.birthdate,LEar:s.lEar,REar:s.rEar,Sire:s.sire,Dam:s.dam,Breeder:s.breeder,Price:s.price,County:s.county,Active:s.active?'Yes':'No',TargetWeight:s.targetWeight,TargetDate:s.targetDate,Notes:s.notes}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ex),'Exhibitors');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Sheep');const wr=[];sheep.forEach(s=>weightsFor(s.id).forEach(r=>wr.push({Sheep:s.name,Date:r.date,WeightLb:r.weight})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wr),'Weights');const fr=[];sheep.forEach(s=>feedHistory(s.id).forEach(r=>fr.push({Sheep:s.name,Date:r.date,Feed:r.feedName,FeedLb:r.feedLbs,FeedOz:r.feedOz,SupplementOz:r.supplementOz,DrenchCc:r.drenchCc,HayHandfuls:r.hay,Additional:r.additional})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(fr),'Feeds');const hr=[];sheep.forEach(s=>(S.health[S.year]&&S.health[S.year][s.id]||[]).forEach(r=>hr.push({Sheep:s.name,Date:r.date,Type:r.type,Product:r.product,Dose:r.dose,Notes:r.notes})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(hr),'Health');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(showShows().map(s=>({Show:s.name,Date:s.date,City:s.city,State:s.state,Exhibitors:s.exhibitorIds.map(id=>ex.find(e=>e.id===id)?.name||'').join(', '),Sheep:s.sheepIds.map(id=>sheep.find(x=>x.id===id)?.name||'').join(', '),Notes:s.notes}))),'Show Calendar');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(showResults().map(r=>({Show:r.showName,Exhibitor:ex.find(e=>e.id===r.exhibitor)?.name||r.exhibitor,Sheep:sheep.find(s=>s.id===r.sheepId)?.name||r.sheepId,ShowedAs:r.showedAs,Placing:r.placing}))),'Show Results');XLSX.writeFile(wb,'Gehret_Sheep_Co_'+S.year+'.xlsx')}
render();
</script></body></html>
